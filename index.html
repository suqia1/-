async function loadAndRenderMonthly(){
  const content = document.getElementById('monthlyContent');
  content.innerHTML = `<div class="empty-state">جارٍ التحميل…</div>`;
  const yyyymm = state.reportMonth;
  const total = daysInMonth(yyyymm);
  const data = await loadMonthData(yyyymm);
  const monthMosques = sortMosquesByOrder(mosquesForMonth(yyyymm), state.monthlyMosqueOrder);

  // build 5 week-chunks of 7 days starting at day 1
  const weeks = [];
  for(let w=0; w<5; w++){
    const days = [];
    for(let i=0;i<7;i++){
      const dayNum = w*7 + i + 1;
      days.push(dayNum);
    }
    weeks.push(days);
  }
  const weekLabels = ['الأسبوع الأول','الأسبوع الثاني','الأسبوع الثالث','الأسبوع الرابع','الأسبوع الخامس'];

  function dayInfo(dayNum){
    if(dayNum>total) return null; // beyond this month
    return monthDateStr(yyyymm, dayNum);
  }
  function distributedFor(mosqueId, dateStr){
    if(!dateStr) return 0;
    const rec = data[mosqueId][dateStr];
    if(!rec || !rec.gsApproved) return 0;
    return totalDistributedFromRecord(rec);
  }
  function withdrawnFor(mosqueId, dateStr){
    if(!dateStr) return 0;
    const rec = data[mosqueId][dateStr];
    if(!rec || !rec.withdrawals || !rec.gsApproved) return 0;
    return rec.withdrawals.reduce((s,w)=>s+(Number(w.qty)||0),0);
  }
  function tankerOnlyFor(mosqueId, dateStr){
    if(!dateStr) return 0;
    const rec = data[mosqueId][dateStr];
    return (rec && rec.gsApproved) ? (Number(rec.qtyDistributed)||0) : 0;
  }
  function sourceLabel(dateStr){
    if(!dateStr) return '';
    let fridge=false, tanker=false;
    monthMosques.forEach(m=>{
      const rec = data[m.id] ? data[m.id][dateStr] : null;
      if(!rec || !rec.savedAt) return;
      if(withdrawnFor(m.id, dateStr) > 0) fridge = true;
      if(tankerOnlyFor(m.id, dateStr) > 0) tanker = true;
    });
    const fName = state.monthlyLabels.fridgeSourceName, tName = state.monthlyLabels.tankerSourceName;
    if(fridge && tanker) return `${fName} / ${tName}`;
    if(fridge) return fName;
    if(tanker) return tName;
    return '';
  }
  function tankerMosquesLabel(dateStr){
    if(!dateStr) return '';
    const names = monthMosques.filter(m=>{
      const rec = data[m.id] ? data[m.id][dateStr] : null;
      return rec && rec.savedAt && tankerOnlyFor(m.id, dateStr) > 0;
    }).map(m=>m.name);
    return names.join(' و ');
  }

  // weekly + monthly totals per mosque (cartons)
  const weeklyTotals = {}; // [mosqueId][weekIdx] = cartons
  const monthlyTotals = {}; // [mosqueId] = cartons
  monthMosques.forEach(m=>{ weeklyTotals[m.id]=[0,0,0,0,0]; monthlyTotals[m.id]=0; });

  const weekBlocksHTML = weeks.map((days, wIdx)=>{
    const dateStrs = days.map(dayInfo);
    // per-mosque weekly totals
    const rowsHTML = monthMosques.map(m=>{
      let weekCartons = 0;
      const dayCells = dateStrs.map(ds=>{
        if(!ds) return `<td class="mt-na">/</td>`;
        const qty = distributedFor(m.id, ds);
        weekCartons += qty;
        return `<td>${qty||''}</td>`;
      }).join('');
      weeklyTotals[m.id][wIdx] = weekCartons;
      monthlyTotals[m.id] += weekCartons;
      return `<tr>
        <td class="mt-label">${m.name}</td>
        ${dayCells}
        <td>${weekCartons.toFixed(1)}</td>
        <td>${Math.round(weekCartons*40)}</td>
        <td>${(weekCartons*2).toFixed(1)}</td>
      </tr>`;
    }).join('');

    const weekTotalCartons = monthMosques.reduce((s,m)=>s+weeklyTotals[m.id][wIdx],0);
    const totalDayCells = dateStrs.map(ds=>{
      if(!ds) return `<td class="mt-na">/</td>`;
      const t = monthMosques.reduce((s,m)=>s+distributedFor(m.id,ds),0);
      return `<td>${t||''}</td>`;
    }).join('');
    const sourceDayCells = dateStrs.map(ds=>{
      if(!ds) return `<td class="mt-na">/</td>`;
      return `<td>${sourceLabel(ds)||'—'}</td>`;
    }).join('');
    const tankerMosqueDayCells = dateStrs.map(ds=>{
      if(!ds) return `<td class="mt-na">/</td>`;
      return `<td>${tankerMosquesLabel(ds)||'لا يوجد'}</td>`;
    }).join('');

    const dayNameCells = dateStrs.map(ds=> ds ? `<th>${dayNameOnly(ds)}</th>` : `<th class="mt-na">—</th>`).join('');
    const dateCells = dateStrs.map(ds=> ds ? `<th>${ds.slice(8,10)}/${ds.slice(5,7)}/${ds.slice(2,4)}</th>` : `<th class="mt-na">—</th>`).join('');

    return `
    <div class="month-table-wrap">
      <table class="month-table">
        <colgroup>
          <col class="mt-col-label">
          <col><col><col><col><col><col><col>
          <col><col><col>
        </colgroup>
        <thead class="mt-head">
          <tr class="week-bar"><td colspan="11">${weekLabels[wIdx]}</td></tr>
          <tr><th>اليوم</th>${dayNameCells}<th colspan="3">الكراتين / العبوات / الربطات</th></tr>
          <tr><th>التاريخ</th>${dateCells}<th>الكراتين</th><th>العبوات</th><th>الربطات</th></tr>
        </thead>
        <tbody>
          ${rowsHTML}
          <tr class="mt-total-row">
            <td class="mt-label">المجموع الكلي للتوزيع</td>
            ${totalDayCells}
            <td>${weekTotalCartons.toFixed(1)}</td>
            <td>${Math.round(weekTotalCartons*40)}</td>
            <td>${(weekTotalCartons*2).toFixed(1)}</td>
          </tr>
        </tbody>
      </table>
    </div>`;
  }).join('');

  // monthly summary table

async function loadAndRenderRange(){
  const content = document.getElementById('monthlyContent');
  content.innerHTML = `<div class="empty-state">جارٍ التحميل…</div>`;
  const mode = state.monthlyMode;
  let months = [];
  if(mode==='quarter'){
    const startM = (state.quarterSel-1)*3 + 1;
    months = [startM, startM+1, startM+2].map(m=>`${state.statYear}-${pad(m)}`);
  } else if(mode==='half'){
    const startM = (state.halfSel-1)*6 + 1;
    months = Array.from({length:6}, (_,i)=>`${state.statYear}-${pad(startM+i)}`);
  } else if(mode==='year'){
    months = Array.from({length:12}, (_,i)=>`${state.statYear}-${pad(i+1)}`);
  } else if(mode==='manual'){
    months = Array.from(new Set((state.monthlySlots||[]).filter(Boolean))).sort();
  }
  if(!months.length){
    content.innerHTML = `<div class="empty-state">اختر الأشهر التي تريد تجميع إحصائياتها من الخانات أعلاه.</div>`;
    return;
  }
  const rangeMosques = mosquesForRange(months);

  // load and sum data for every selected month
  const totals = {}; // [mosqueId] = cartons (combined)
  const fridgeTotals = {}, tankerTotals = {};
  rangeMosques.forEach(m=>{ totals[m.id] = 0; fridgeTotals[m.id] = 0; tankerTotals[m.id] = 0; });
  for(const yyyymm of months){
    const data = await loadMonthData(yyyymm);
    const total = daysInMonth(yyyymm);
    rangeMosques.forEach(m=>{
      for(let d=1; d<=total; d++){
        const dateStr = monthDateStr(yyyymm, d);
        const rec = data[m.id] ? data[m.id][dateStr] : null;
        const approvedRec = (rec && rec.gsApproved) ? rec : null;
        totals[m.id] += totalDistributedFromRecord(approvedRec);
        if(approvedRec){
          fridgeTotals[m.id] += (approvedRec.withdrawals||[]).reduce((s,w)=>s+(Number(w.qty)||0),0);
          tankerTotals[m.id] += Number(approvedRec.qtyDistributed)||0;
        }
      }
    });
  }

  const grandTotal = rangeMosques.reduce((s,m)=>s+totals[m.id],0);
  const cl = state.monthlyColumnLabels;
  function summaryTableHTML(wrapId, valuesObj, extraColLabel){
    const gt = rangeMosques.reduce((s,m)=>s+valuesObj[m.id],0);
    const rows = rangeMosques.map(m=>{
      const pct = gt>0 ? (valuesObj[m.id]/gt*100) : 0;
      return `<tr>
        <td class="mt-label">${m.name}${m.active===false?' <span class="badge badge-no">مؤرشف</span>':''}</td>
        <td><strong>${gt>0 ? pct.toFixed(0)+'%' : '—'}</strong></td>
        <td>${(valuesObj[m.id]*2).toFixed(1)}</td>
        <td>${Math.round(valuesObj[m.id]*40)}</td>
        <td>${valuesObj[m.id].toFixed(1)}</td>
      </tr>`;
    }).join('');
    return `
    <div class="month-table-wrap" style="border:none" id="${wrapId}">
      ${extraColLabel ? `<h3 style="margin:22px 0 8px">${extraColLabel}</h3>` : ''}
      <table class="month-summary-table">
        <thead>
          <tr>
            <th>${cl.site}</th>
            <th>${cl.percentage}</th>
            <th>${cl.totalBundles}</th><th>${cl.totalPackets}</th><th>${cl.totalCartons}</th>
          </tr>
        </thead>
        <tbody>
          ${rows || `<tr><td colspan="5">لا توجد بيانات لهذه الفترة.</td></tr>`}
          <tr class="mt-total-row">
            <td class="mt-label">${cl.grandTotal}</td>
            <td>${gt>0?'100%':'—'}</td>
            <td>${(gt*2).toFixed(1)}</td>
            <td>${Math.round(gt*40)}</td>
            <td>${gt.toFixed(1)}</td>
          </tr>
        </tbody>
      </table>
    </div>`;
  }

  const rangeLabel = months.join('، ');
  content.innerHTML = `
    <p class="muted small">إحصائية مجمّعة للأشهر المحددة يدويًا (${rangeLabel}) — تشمل كل موقع كان له تسجيل خلال هذه الأشهر، حتى لو أُضيف أو أُزيل في منتصفها.</p>
    ${summaryTableHTML('rangeFullTableWrap', totals)}
    ${summaryTableHTML('rangeFridgeTableWrap', fridgeTotals, state.monthlyLabels.fridgeSourceName)}
    ${summaryTableHTML('rangeTankerTableWrap', tankerTotals, state.monthlyLabels.tankerSourceName)}
  `;
  state.lastMonthlyExportData = {type:'range', mode, rangeLabel, rangeMosques, totals, fridgeTotals, tankerTotals};
}

async function renderIndicatorDailyDetail(mosqueId){

async function loadAndRenderIndicator(mosqueId){
  const content = document.getElementById('indicatorContent');
  content.innerHTML = `<div class="empty-state">جارٍ التحميل…</div>`;
  const mode = state.indicatorMode;
  let months = [];
  if(mode==='current'){
    months = [state.indicatorMonth];
  } else if(mode==='quarter'){
    const startM = (state.indicatorQuarterSel-1)*3 + 1;
    months = [startM, startM+1, startM+2].map(m=>`${state.indicatorYear}-${pad(m)}`);
  }
  const m = mosqueById(mosqueId);
  if(!m){
    content.innerHTML = `<p class="muted small">الموقع غير موجود.</p>`;
    return;
  }
  const rangeMosques = [m];

  // build ordered list of dates with per-mosque daily quantity
  const days = [];
  for(const yyyymm of months){
    const data = await loadMonthData(yyyymm);
    const total = daysInMonth(yyyymm);
    for(let d=1; d<=total; d++){
      const dateStr = monthDateStr(yyyymm, d);
      const values = {};
      rangeMosques.forEach(mm=>{
        const rec = data[mm.id] ? data[mm.id][dateStr] : null;
        values[mm.id] = totalDistributedFromRecord(rec);
      });
      days.push({date: dateStr, values});
    }
  }

  renderIndicatorChart(content, rangeMosques, days, {
    [m.id]: {label:'عدد المتعاونين', value: state.collaborators.filter(c=>c.mosqueId===m.id).length}
  });
}
async function avgCollaboratorsForMosque(mosqueId, months){
  let daySum = 0, dayCount = 0;
  for(const yyyymm of months){
    const total = daysInMonth(yyyymm);
    for(let d=1; d<=total; d++){
      const dateStr = monthDateStr(yyyymm, d);
      const rec = await loadRecord(mosqueId, dateStr);
      if(!rec || !rec.savedAt) continue;
      const present = Object.values(rec.attendance||{}).filter(v=>v==='present').length;
      daySum += present;
      dayCount++;
    }
  }
  return dayCount>0 ? (daySum/dayCount) : 0;
}

function zigzagIndices(values){
  const n = values.length;
  if(n<=2) return values.map((_,i)=>i);
  const idxs = [0];
  for(let i=1;i<n-1;i++){
    const prevDiff = values[i] - values[idxs[idxs.length-1]];
    const nextDiff = values[i+1] - values[i];
    if(prevDiff===0) continue;
    if((prevDiff>0 && nextDiff<0) || (prevDiff<0 && nextDiff>0)){
      idxs.push(i);
    }
  }
  idxs.push(n-1);
  return idxs;
}
function renderIndicatorChart(content, rangeMosques, days, collabInfo){
  const W = 900, H = 380, padL = 20, padR = 46, padT = 20, padB = 40;
  const chartW = W - padL - padR, chartH = H - padT - padB;
  const rawMax = Math.max(1, ...days.map(d=>Math.max(...rangeMosques.map(m=>d.values[m.id]))));
  const step = 50;
  const maxVal = Math.max(step, Math.ceil(rawMax/step)*step);
  const n = days.length;
  const xFor = i => n<=1 ? padL : padL + (i/(n-1))*chartW;
  const yFor = v => padT + chartH - (v/maxVal)*chartH;

  // Y-axis labels in steps of 50, on the right side
  const yTicks = [];
  for(let v=0; v<=maxVal; v+=step) yTicks.push(v);
  const yAxisHTML = yTicks.map(v=>`
    <line x1="${padL}" y1="${yFor(v)}" x2="${padL+chartW}" y2="${yFor(v)}" stroke="#F1ECE0" stroke-width="1"/>
    <text x="${padL+chartW+8}" y="${yFor(v)+3}" font-size="10" fill="#8a8377" text-anchor="start">${v}</text>`).join('');

  // sparse x-axis labels (about 8 across the chart)
  const labelEvery = Math.max(1, Math.ceil(n/8));
  const xLabels = days.map((d,i)=> i%labelEvery===0 || i===n-1 ? `
    <text x="${xFor(i)}" y="${H-14}" font-size="11" fill="#8a8377" text-anchor="middle">${d.date.slice(8,10)}/${d.date.slice(5,7)}</text>` : '').join('');

  const lines = rangeMosques.map(m=>{
    const values = days.map(d=>d.values[m.id]);
    const pts = values.map((v,i)=>`${xFor(i)},${yFor(v)}`).join(' ');
    return `<polyline data-mosque="${m.id}" points="${pts}" fill="none" stroke="${m.color}" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>`;
  }).join('');

  const legend = `<div class="indicator-legend">${rangeMosques.map(m=>`
    <span class="leg-item"><span class="leg-dot" style="background:${m.color}"></span>${m.name}</span>`).join('')}</div>`;

  // max/min per mosque across the selected period
  const maxMinHTML = rangeMosques.map(m=>{
    let maxDay = days[0], minDay = days[0];
    days.forEach(d=>{
      if(d.values[m.id] > maxDay.values[m.id]) maxDay = d;
      if(d.values[m.id] < minDay.values[m.id]) minDay = d;
    });
    const fmt = d => {
      const parts = [];
      if(state.indicatorLabels.showDay) parts.push(dayNameOnly(d.date));
      if(state.indicatorLabels.showDate) parts.push(`${d.date.slice(8,10)}/${d.date.slice(5,7)}/${d.date.slice(0,4)}`);
      return parts.join(' — ');
    };
    return `
    <div class="card" style="margin-top:12px">
      <div class="row gap-sm" style="align-items:center;margin-bottom:8px">
        <span class="leg-dot" style="background:${m.color};width:12px;height:12px;border-radius:50%;display:inline-block"></span>
        <strong>${m.name}</strong>
      </div>
      <div class="row gap-lg wrap">
        <div><div class="label" style="margin-bottom:2px">${state.indicatorLabels.maxLabel}</div><div class="kv-readonly">${maxDay.values[m.id].toFixed(1)}</div><div class="muted small">${fmt(maxDay)}</div></div>
        <div><div class="label" style="margin-bottom:2px">${state.indicatorLabels.minLabel}</div><div class="kv-readonly">${minDay.values[m.id].toFixed(1)}</div><div class="muted small">${fmt(minDay)}</div></div>
        ${collabInfo && collabInfo[m.id] ? `<div><div class="label" style="margin-bottom:2px">${collabInfo[m.id].label}</div><div class="kv-readonly">${collabInfo[m.id].value}</div></div>` : ''}
      </div>
    </div>`;
  }).join('');

  content.innerHTML = `
    <div style="position:relative">
      <svg id="indicatorSvg" viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block;touch-action:none;cursor:crosshair">
        ${yAxisHTML}
        <line x1="${padL}" y1="${padT+chartH}" x2="${padL+chartW}" y2="${padT+chartH}" stroke="#DED4BC" stroke-width="1"/>
        ${xLabels}
        ${lines}
        <line id="indHoverLine" x1="0" y1="${padT}" x2="0" y2="${padT+chartH}" stroke="#999" stroke-width="1" stroke-dasharray="3,3" style="display:none"/>
        <circle id="indHoverDot" r="4.5" style="display:none"/>
      </svg>
      <div id="indTooltip" style="position:absolute;display:none;background:#fff;border:1px solid var(--line);border-radius:8px;box-shadow:0 4px 14px rgba(0,0,0,.12);padding:8px 10px;font-size:12.5px;pointer-events:none;z-index:5;min-width:150px"></div>
    </div>
    ${legend}
    <h3 style="margin:18px 0 0">${state.indicatorLabels.summaryTitle}</h3>
    ${maxMinHTML}
  `;

  const svg = document.getElementById('indicatorSvg');
  const hoverLine = document.getElementById('indHoverLine');
  const hoverDot = document.getElementById('indHoverDot');
  const tooltip = document.getElementById('indTooltip');

  function showAt(clientX, clientY){
    const pt = svg.createSVGPoint();
    pt.x = clientX; pt.y = clientY;
    const svgP = pt.matrixTransform(svg.getScreenCTM().inverse());
    let idx = Math.round(((svgP.x - padL) / chartW) * (n-1));
    idx = Math.max(0, Math.min(n-1, idx));
    const day = days[idx];

    // find which mosque line is closest vertically to the cursor at this x position
    let closest = rangeMosques[0], closestDist = Infinity;
    rangeMosques.forEach(m=>{
      const dist = Math.abs(yFor(day.values[m.id]) - svgP.y);
      if(dist < closestDist){ closestDist = dist; closest = m; }
    });

    hoverLine.setAttribute('x1', xFor(idx));
    hoverLine.setAttribute('x2', xFor(idx));
    hoverLine.style.display = 'block';
    hoverDot.setAttribute('cx', xFor(idx));
    hoverDot.setAttribute('cy', yFor(day.values[closest.id]));
    hoverDot.setAttribute('fill', closest.color);
    hoverDot.style.display = 'block';

    const tParts = [];
    if(state.indicatorLabels.showDay) tParts.push(dayNameOnly(day.date));
    if(state.indicatorLabels.showDate) tParts.push(`${day.date.slice(8,10)}/${day.date.slice(5,7)}/${day.date.slice(0,4)}`);
    tooltip.innerHTML = `
      <div style="font-weight:800;margin-bottom:4px">${tParts.join(' — ')}</div>
      <div style="display:flex;align-items:center;gap:6px">
        <span style="width:9px;height:9px;border-radius:50%;background:${closest.color};display:inline-block"></span>
        <span>${closest.name}</span>
      </div>
      <div style="margin-top:2px"><strong>${day.values[closest.id].toFixed(1)}</strong> كرتون</div>
    `;
    tooltip.style.display = 'block';
    const rect = svg.getBoundingClientRect();
    let left = clientX - rect.left + 14;
    if(left + 170 > rect.width) left = clientX - rect.left - 184;
    tooltip.style.left = left + 'px';
    tooltip.style.top = (clientY - rect.top - 60) + 'px';
  }
  function hide(){ hoverLine.style.display='none'; hoverDot.style.display='none'; tooltip.style.display='none'; }

  svg.addEventListener('mousemove', e=>showAt(e.clientX, e.clientY));
  svg.addEventListener('mouseleave', hide);
  svg.addEventListener('touchstart', e=>{ const t=e.touches[0]; if(t) showAt(t.clientX, t.clientY); }, {passive:true});
  svg.addEventListener('touchmove', e=>{ const t=e.touches[0]; if(t) showAt(t.clientX, t.clientY); }, {passive:true});
  svg.addEventListener('touchend', hide);
}

        </div>
        <div style="width:100%">
          <div class="row" style="justify-content:space-between;align-items:center">
            <label class="label" style="margin:0">طول الجدول</label>
            <span class="muted small" id="hPctVal_${mode}">${hPct}%</span>
          </div>
          <input type="range" min="30" max="200" step="5" value="${hPct}" data-hpct="${mode}" style="width:100%">
        </div>
        <div style="width:100%">
          <div class="row" style="justify-content:space-between;align-items:center">
            <label class="label" style="margin:0">عرض الجدول</label>
            <span class="muted small" id="wPctVal_${mode}">${wPct}%</span>
          </div>
          <input type="range" min="30" max="200" step="5" value="${wPct}" data-wpct="${mode}" style="width:100%">
        </div>
        ${['quarter','half','year','manual'].includes(mode) ? (()=>{
          const tv = state.monthlyTableVisibility[mode] || {full:true, fridge:true, tanker:true};
          const row = (key, label) => `
            <div class="row" style="justify-content:space-between;align-items:center;width:100%;border-top:1px solid var(--line);padding-top:8px;margin-top:6px">
              <span class="muted small">${label}</span>

            </div>`;
          return row('full','الجدول الكامل') + row('tanker', state.monthlyLabels.tankerSourceName) + row('fridge', state.monthlyLabels.fridgeSourceName);
        })() : ''}
      </div>
    </div>`;
  }).join('');
  Array.from(wrap.querySelectorAll('[data-tablevis]')).forEach(b=>{
    b.addEventListener('click', async ()=>{
      const [mode, key] = b.dataset.tablevis.split(':');
      if(!state.monthlyTableVisibility[mode]) state.monthlyTableVisibility[mode] = {full:true, fridge:true, tanker:true};
      state.monthlyTableVisibility[mode][key] = state.monthlyTableVisibility[mode][key]!==false ? false : true;
      const ok = await saveMonthlyTableVisibility();
      if(ok) toast('تم الحفظ'); else toast('تعذر الحفظ، حاول مرة أخرى','err');
      renderBgCards(main, modes, wrapId, rerenderFn);
    });
  });
  Array.from(wrap.querySelectorAll('[data-bgtitle]')).forEach(inp=>{
    inp.addEventListener('change', async ()=>{
      const mode = inp.dataset.bgtitle;

      const ok = await saveBgModeLabels();
      if(ok) toast('تم الحفظ'); else toast('تعذر الحفظ، حاول مرة أخرى','err');
    });
  });
  modes.forEach(mode=>{
    document.getElementById(`bgInput_${mode}`).addEventListener('change', async e=>{
      const file = e.target.files[0]; if(!file) return;
      try{
        let dataUrl;
        if(file.type==='application/pdf' || file.name.toLowerCase().endsWith('.pdf')){
          toast('جارٍ استخراج الصورة من ملف PDF…');
          dataUrl = await extractImageFromPdf(file);
        } else {
          dataUrl = await compressImage(file, 1000, 0.82);
        }
        state.reportBackgrounds[mode] = dataUrl;
        const ok = await saveReportBackgrounds();
        if(ok) toast('تم تحديث الخلفية'); else toast('تعذر الحفظ، حاول مرة أخرى','err');
        rerenderFn(main);
      }catch(err){ toast('تعذر معالجة الملف، تأكد أنه صورة أو PDF صالح','err'); }
    });
  });
  Array.from(wrap.querySelectorAll('[data-remove-bg]')).forEach(b=>{
    b.addEventListener('click', async ()=>{
      const mode = b.dataset.removeBg;
      state.reportBackgrounds[mode] = null;
      await saveReportBackgrounds();
      toast('تمت إزالة الخلفية');
      rerenderFn(main);
    });
  });
  Array.from(wrap.querySelectorAll('[data-orient]')).forEach(b=>{
    b.addEventListener('click', async ()=>{
      const [mode, orient] = b.dataset.orient.split(':');
      state.pdfOrientations[mode] = orient;
      await savePdfOrientations();
      renderBgCards(main, modes, wrapId, rerenderFn);
    });
  });
  Array.from(wrap.querySelectorAll('[data-voff]')).forEach(slider=>{
    slider.addEventListener('input', ()=>{
      const label = document.getElementById(`vOffVal_${slider.dataset.voff}`);
      if(label) label.textContent = slider.value;
    });
    slider.addEventListener('change', async ()=>{
      state.pdfVOffset[slider.dataset.voff] = Number(slider.value);
      await savePdfVOffset();
    });
  });
  Array.from(wrap.querySelectorAll('[data-hpct]')).forEach(slider=>{
    slider.addEventListener('input', ()=>{
      const label = document.getElementById(`hPctVal_${slider.dataset.hpct}`);
      if(label) label.textContent = slider.value + '%';
    });
    slider.addEventListener('change', async ()=>{
      state.pdfHeightPct[slider.dataset.hpct] = Number(slider.value);
      await savePdfHeightPct();
    });
  });
  Array.from(wrap.querySelectorAll('[data-wpct]')).forEach(slider=>{
    slider.addEventListener('input', ()=>{
      const label = document.getElementById(`wPctVal_${slider.dataset.wpct}`);
      if(label) label.textContent = slider.value + '%';
    });
    slider.addEventListener('change', async ()=>{
      state.pdfWidthPct[slider.dataset.wpct] = Number(slider.value);
      await savePdfWidthPct();
    });
  });
}

    [arr[idx], arr[swapWith]] = [arr[swapWith], arr[idx]];

      <button type="button" class="btn btn-ghost btn-sm" data-hf-delete="${f.id}">حذف</button>
    </div>`).join('');
  wrap.innerHTML = fixedRows + customRows;
  Array.from(wrap.querySelectorAll('[data-hf-rename]')).forEach(inp=>{
    inp.addEventListener('change', async ()=>{
      const key = inp.dataset.hfRename;
      if(key.startsWith('custom:')){
        const id = key.split(':')[1];
        const f = hc.customFields.find(x=>x.id===id);
        if(f) f.label = inp.value || f.label;
      } else {
        hc[key].label = inp.value || hc[key].label;
      }
      const ok = await saveReportHeaderConfig();
      if(ok) toast('تم الحفظ'); else toast('تعذر الحفظ، حاول مرة أخرى','err');
    });
  });
  Array.from(wrap.querySelectorAll('[data-hf-toggle]')).forEach(b=>{
    b.addEventListener('click', async ()=>{
      const key = b.dataset.hfToggle;
      if(key.startsWith('custom:')){
        const id = key.split(':')[1];
        const f = hc.customFields.find(x=>x.id===id);
        if(f) f.visible = f.visible===false ? true : false;
      } else {
        hc[key].visible = hc[key].visible===false ? true : false;
      }
      await saveReportHeaderConfig();
      renderReportHeaderFieldsList(main);
    });
  });
  Array.from(wrap.querySelectorAll('[data-hf-delete]')).forEach(b=>{
    b.addEventListener('click', async ()=>{
      hc.customFields = hc.customFields.filter(f=>f.id!==b.dataset.hfDelete);
      await saveReportHeaderConfig();
      renderReportHeaderFieldsList(main);
      toast('تم حذف الحقل');
    });
  });

let sharedSettingsPollInterval = null;
function startSharedSettingsPoll(main, anchorElId, checkChangedFn, rerenderFn){
  if(sharedSettingsPollInterval) clearInterval(sharedSettingsPollInterval);
  sharedSettingsPollInterval = setInterval(async ()=>{
    if(!document.getElementById(anchorElId)){ clearInterval(sharedSettingsPollInterval); sharedSettingsPollInterval = null; return; }
    const active = document.activeElement;
    const isTyping = active && main.contains(active) && (active.tagName==='INPUT' || active.tagName==='SELECT' || active.tagName==='TEXTAREA');
    if(isTyping) return;
    const changed = await checkChangedFn();
    if(changed) rerenderFn();
  }, 5000);
}

const MOSQUE_COLOR_PALETTE = ['#E63B2E','#2FAE4E','#2F6FE0','#E8A73B','#9B4FE0','#2FBFC4','#D6408F','#7A8B2E'];
const MOSQUE_ARCHIVE_DAYS = 30;
function daysBetween(dateStrA, dateStrB){
  const [ya,ma,da] = dateStrA.split('-').map(Number);
  const [yb,mb,db] = dateStrB.split('-').map(Number);
  const msPerDay = 86400000;
  return Math.round((new Date(yb,mb-1,db) - new Date(ya,ma-1,da)) / msPerDay);
}

  MOSQUES.push({id, name, color, active:true, createdMonth: state.today.slice(0,7), deletedMonth:null, deletedAt:null, deactivatedUserIds:[]});

async function deleteMosque(id, main){
  const m = mosqueById(id);
  if(!m) return;
  if(!confirm(`هل تريدين إزالة "${m.name}"؟ يمكن استعادته خلال 30 يومًا من الأرشيف، وستبقى بياناته السابقة محفوظة دائمًا.`)) return;
  m.active = false;
  m.deletedMonth = state.today.slice(0,7);
  m.deletedAt = state.today;
  // deactivate supervisor accounts tied to this mosque so they can no longer log in, remembering which ones we touched
  const touchedIds = [];
  state.users.forEach(u=>{ if(u.mosqueId===id && u.active!==false){ u.active = false; touchedIds.push(u.id); } });
  m.deactivatedUserIds = touchedIds;
  await saveMosques();
  if(touchedIds.length) await storageSet('skq_users', JSON.stringify(state.users));
  toast('تم نقل الموقع إلى الأرشيف — يمكن استعادته خلال 30 يومًا');
  renderAdminPrivateInfo(main);
}
async function purgeMosque(id, main){
  const m = mosqueById(id);
  if(!m) return;
  if(!confirm(`هل تريدين حذف "${m.name}" نهائيًا؟ سيختفي فورًا من كل الجداول، بما فيها جدول الكراتين الموزعة لهذا الشهر تحديدًا. هذا الإجراء لا يمكن التراجع عنه.`)) return;
  MOSQUES = MOSQUES.filter(x=>x.id!==id);
  await saveMosques();
  toast('تم حذف الموقع نهائيًا');
  renderAdminPrivateInfo(main);
}
async function restoreMosque(id, main){
  const m = mosqueById(id);
  if(!m) return;
  m.active = true;
  m.deletedMonth = null;
  m.deletedAt = null;
  const touchedIds = m.deactivatedUserIds || [];
  m.deactivatedUserIds = [];
  await saveMosques();
  if(touchedIds.length){
    state.users.forEach(u=>{ if(touchedIds.includes(u.id)) u.active = true; });
    await storageSet('skq_users', JSON.stringify(state.users));
  }
  toast('تمت استعادة الموقع بنجاح');
  renderAdminPrivateInfo(main);
}

    await loadMosques(); // pick up supplierShortfall changes made by المورد in another session

async function computeLiveSupplierQty(mosqueId, uptoDate){
  uptoDate = uptoDate || state.today;
  const m = mosqueById(mosqueId);
  const cfg = getFormConfig(mosqueId);
  const startBound = m.supplierClaimedThroughDate || addDays(state.today, -366);
  let cursor = startBound;
  const days = [];
  let sum = 0;
  let guard = 0;
  while(cursor <= uptoDate && guard < 367){
    const rec = await loadRecord(mosqueId, cursor);
    const dayWithdrawn = (rec.withdrawals||[]).reduce((s,w)=>s+(Number(w.qty)||0),0);
    const claimed = rec.orderClaimedQty || 0;
    const unclaimed = Math.max(0, dayWithdrawn - claimed);
    if(unclaimed > 0) days.push({date: cursor, qty: unclaimed});
    sum += unclaimed;
    cursor = addDays(cursor, 1);
    guard++;
  }
  const limit = cfg.fridge.limitValue || 0;
  const excess = (limit>0 && sum>limit) ? (sum-limit) : 0;
  const capped = sum - excess;
  return {total: capped, excess, days};
}
async function confirmSupplierOrder(mosqueId, dateStr, manualQty){
  const m = mosqueById(mosqueId);
  if(!m) return;
  const live = await computeLiveSupplierQty(mosqueId, dateStr);
  // mark every contributing day as claimed up to its current withdrawal amount — any withdrawal added to that day AFTER this point becomes immediately available again
  for(const d of live.days){
    const r = await loadRecord(mosqueId, d.date);
    const dayWithdrawn = (r.withdrawals||[]).reduce((s,w)=>s+(Number(w.qty)||0),0);
    r.orderClaimedQty = dayWithdrawn;
    await storageSet(recKey(mosqueId, d.date), JSON.stringify(r));
  }
  const rec = await loadRecord(mosqueId, dateStr);
  rec.supplierOrderConfirmed = true;
  rec.orderPendingGsApproval = false;
  if(!rec.orderRequestedTime) rec.orderRequestedTime = nowTime12raw();
  rec.orderApprovedTime = nowTime12raw();
  rec.orderMode = 'manual';
  rec.orderAutoQty = live.total;
  rec.orderRequestedQty = (manualQty!==undefined && manualQty!==null) ? manualQty : 0;
  rec.orderClaimedDays = live.days.map(d=>d.date);
  rec.orderCancelled = false;
  await storageSet(recKey(mosqueId, dateStr), JSON.stringify(rec));
  const maxClaimedDate = live.days.length ? live.days[live.days.length-1].date : dateStr;
  if(!m.supplierClaimedThroughDate || maxClaimedDate > m.supplierClaimedThroughDate) m.supplierClaimedThroughDate = addDays(maxClaimedDate, 1);
  await saveMosques();
}

async function cancelSupplierOrder(mosqueId, dateStr, cancelledBy){
  const rec = await loadRecord(mosqueId, dateStr);
  if(rec.supplierOrderReceived){ toast('لا يمكن إلغاء الطلب بعد قبوله من المورد','err'); return; }
  const claimedDays = rec.orderClaimedDays || [];
  for(const d of claimedDays){
    const r = await loadRecord(mosqueId, d);
    r.orderClaimedQty = 0; // unclaim — whatever is withdrawn there becomes available again, merging back into the live total
    await storageSet(recKey(mosqueId, d), JSON.stringify(r));
  }
  const m = mosqueById(mosqueId);
  if(m && claimedDays.length){
    const earliestUnclaimed = claimedDays.reduce((a,b)=> a<b?a:b);
    if(!m.supplierClaimedThroughDate || earliestUnclaimed < m.supplierClaimedThroughDate){ m.supplierClaimedThroughDate = earliestUnclaimed; await saveMosques(); }
  }
  rec.supplierOrderConfirmed = false;
  rec.orderCancelled = true;
  rec.orderCancelledBy = cancelledBy || 'staff';
  rec.pendingManualQty = 0;
  await storageSet(recKey(mosqueId, dateStr), JSON.stringify(rec));
}
async function computeMonthlySupplierTotal(mosqueId, yyyymm){
  const totalDays = daysInMonth(yyyymm);
  const lastDay = (yyyymm === state.today.slice(0,7)) ? Number(state.today.slice(8,10)) : totalDays;
  let sum = 0;
  for(let d=1; d<=lastDay; d++){
    const ds = monthDateStr(yyyymm, d);
    const rec = await loadRecord(mosqueId, ds);
    if(rec.supplierOrderConfirmed && !rec.orderCancelled) sum += (rec.orderRequestedQty||0);
  }
  return sum; // مجموع الطلبات المرفوعة فعليًا خلال الشهر (لا يشمل الأيام التي لم يُرفع لها طلب)
}
async function checkAndApplyShortfall(mosqueId, latest, dateStr){
  if(latest.supplierReceiptPhoto && (Number(latest.supplierDeliveredQty)||0)>0 && !latest.supplierShortfallCounted){
    const requested = latest.orderRequestedQty || 0;
    const delivered = Number(latest.supplierDeliveredQty)||0;
    const shortfall = Math.max(0, requested - delivered);
    if(shortfall > 0){
      const m = mosqueById(mosqueId);
      if(m){ m.supplierShortfall = (m.supplierShortfall||0) + shortfall; await saveMosques(); }
    }
    if(delivered > requested) await bumpNotifSite(['supplier','supplierorder'], mosqueId); // notify: توريد كمية أكثر من المطلوب
    latest.supplierShortfallCounted = true;
  }
}
// An order that was never marked "received" by the supplier auto-hides from the supplier's list
// at 3:00 AM the day after its date. Received-but-incomplete orders never expire this way —
// they stay under their original date until fully completed (qty + receipt photo).
function supplierOrderExpired(dateStr, received){
  if(received) return false;
  const [y,m,d] = dateStr.split('-').map(Number);
  const cutoff = new Date(y, m-1, d+1, 3, 0, 0);
  return new Date() >= cutoff;
}
function supplierOrderStatusLabel(rec){
  if(rec.orderCancelled) return 'تم إلغاء الطلب';

  return 'تم الاستلام';
}

      if(!latest.supplierOrderReceived){ latest.supplierExecutedTime = ''; latest.supplierShortfallCounted = false; }
      const ok = await storageSet(recKey(mosqueId, viewDate), JSON.stringify(latest));
      if(ok){ toast(latest.supplierOrderReceived ? 'تم تسجيل استلام الطلب' : 'تم التراجع عن استلام الطلب'); await bumpNotifSite(['supplier','supplierorder'], mosqueId); } else toast('تعذر الحفظ، حاول مرة أخرى','err');
      renderSupplierMain();
    });
  });
  Array.from(main.querySelectorAll('[data-sup-cancel-order]')).forEach(b=>{
    b.addEventListener('click', async ()=>{
      const mosqueId = b.dataset.supCancelOrder;
      await cancelSupplierOrder(mosqueId, viewDate, 'supplier');
      toast('تم إلغاء الطلب');
      await bumpNotifSite(['supplier','supplierorder'], mosqueId);
      renderSupplierMain();
    });
  });
  Array.from(main.querySelectorAll('[data-sup-delivered]')).forEach(inp=>{
    inp.addEventListener('change', async ()=>{
      const mosqueId = inp.dataset.supDelivered;
      const latest = await loadRecord(mosqueId, viewDate);
      if(!latest.supplierOrderReceived) return;
      latest.supplierDeliveredQty = Number(inp.value)||0;
      if(latest.supplierReceiptPhoto && latest.supplierDeliveredQty>0 && !latest.supplierExecutedTime) latest.supplierExecutedTime = nowTime12raw();
      latest.supplierRecordSaved = false; // any edit after saving requires an explicit re-save before admin sees the new value
      await checkAndApplyShortfall(mosqueId, latest, viewDate);
      await storageSet(recKey(mosqueId, viewDate), JSON.stringify(latest));
      await bumpNotifSite(['supplier','supplierorder'], mosqueId);
      renderSupplierMain();
    });
  });
  Array.from(main.querySelectorAll('[data-sup-reset-delivered]')).forEach(b=>{
    b.addEventListener('click', async ()=>{
      const mosqueId = b.dataset.supResetDelivered;
      const latest = await loadRecord(mosqueId, viewDate);
      if(!latest.supplierOrderReceived) return;
      latest.supplierDeliveredQty = 0;
      latest.supplierExecutedTime = '';
      latest.supplierRecordSaved = false;
      await storageSet(recKey(mosqueId, viewDate), JSON.stringify(latest));
      toast('تم التصفير');
      renderSupplierMain();
    });
  });
  Array.from(main.querySelectorAll('[data-sup-save]')).forEach(b=>{
    b.addEventListener('click', async ()=>{
      const mosqueId = b.dataset.supSave;
      const latest = await loadRecord(mosqueId, viewDate);
      if((Number(latest.supplierDeliveredQty)||0) <= 0 || !latest.supplierReceiptPhoto){ toast('أدخل الكمية وأرفق صورة السند أولاً','err'); return; }
      latest.supplierRecordSaved = true;
      latest.supplierRecordSavedAt = nowTime12raw();
      const ok = await storageSet(recKey(mosqueId, viewDate), JSON.stringify(latest));
      if(ok){ toast('تم حفظ الجدول'); await bumpNotifSite(['supplier','supplierorder'], mosqueId); } else toast('تعذر الحفظ، حاول مرة أخرى','err');
      renderSupplierMain();
    });
  });
  sites.forEach(m=>{
    const rec = data[m.id];
    if(rec.supplierOrderReceived && (Number(rec.supplierDeliveredQty)||0) > 0){
      bindFileDrop(`supReceiptInput_${m.id}`, `supReceiptPreview_${m.id}`, null, async v=>{
        const latest = await loadRecord(m.id, viewDate);
        latest.supplierReceiptPhoto = v;
        if(latest.supplierReceiptPhoto && (Number(latest.supplierDeliveredQty)||0)>0 && !latest.supplierExecutedTime) latest.supplierExecutedTime = nowTime12raw();
        latest.supplierRecordSaved = false;
        await checkAndApplyShortfall(m.id, latest, viewDate);
        await storageSet(recKey(m.id, viewDate), JSON.stringify(latest));
        await bumpNotifSite(['supplier','supplierorder'], m.id);
      }, false, rec.supplierReceiptPhoto);
    }
  });

  if(supplierRefreshInterval) clearInterval(supplierRefreshInterval);
  supplierRefreshInterval = setInterval(async ()=>{
    if(!document.getElementById('supplierMain')){ clearInterval(supplierRefreshInterval); supplierRefreshInterval = null; return; }
    await loadMosques();
    // if the day rolled over (past midnight) or the expiry cutoff (3am) hit while this page was open, do a full re-render
    if(state.today !== viewDate && isToday){ renderSupplierMain(); return; }
    if(sites.some(m=>{
      const r = data[m.id];
      return r.supplierOrderConfirmed && !r.supplierOrderReceived && supplierOrderExpired(viewDate, false);
    })){ renderSupplierMain(); return; }
    // check whether the SET of confirmed/cancelled sites for this date changed (e.g. a new order just got confirmed) — if so, do a full re-render so it appears immediately
    const currentData = {};
    for(const m of activeMosques()){ currentData[m.id] = await loadRecord(m.id, viewDate); }
    const currentSites = activeMosques().filter(m=>{
      const r = currentData[m.id];
      if(r.orderCancelled && r.orderCancelledBy==='supplier') return true;
      if(!r.supplierOrderConfirmed) return false;
      if(supplierOrderExpired(viewDate, r.supplierOrderReceived)) return false;
      return true;
    });
    const confirmedIds = currentSites.map(m=>m.id).sort().join(',');
    const shownIds = sites.map(m=>m.id).sort().join(',');
    if(confirmedIds !== shownIds){
      const active = document.activeElement;
      const isTyping = active && main.contains(active) && (active.tagName==='INPUT' || active.tagName==='SELECT' || active.tagName==='TEXTAREA');
      if(!isTyping) renderSupplierMain();
      return;
    }
    for(const m of sites){
      const latest = currentData[m.id];
      const qtyEl = document.getElementById(`supQty_${m.id}`);
      if(qtyEl) qtyEl.textContent = latest.orderRequestedQty || 0;
      const statusEl = document.getElementById(`supStatus_${m.id}`);
      if(statusEl){
        const receivedBadge = latest.supplierOrderReceived
          ? `<span class="badge badge-ok">${state.supplierAccountLabels.receivedBadgeLabel}</span>${latest.supplierRecordSaved ? '' : ` <button class="btn btn-ghost btn-sm" data-sup-receive="${m.id}">${state.supplierAccountLabels.undoBtnLabel}</button>`}`
          : `<button class="btn btn-primary btn-sm" data-sup-receive="${m.id}">${state.supplierAccountLabels.receiveBtnLabel}</button>`;
        const cancelBtn = (latest.supplierOrderReceived || latest.supplierRecordSaved) ? '' : `<button class="btn btn-ghost btn-sm" data-sup-cancel-order="${m.id}" style="color:var(--red)">${state.supplierAccountLabels.cancelBtnLabel}</button>`;
        statusEl.innerHTML = `${receivedBadge} ${cancelBtn}`;
      }
      const timeEl = document.querySelector(`[data-sup-time="${m.id}"]`);
      if(timeEl && document.activeElement!==timeEl) timeEl.value = latest.supplierArrivalTime||'';
    }
    Array.from(document.querySelectorAll('[data-sup-cancel-order]')).forEach(b=>{
      b.addEventListener('click', async ()=>{
        const mosqueId = b.dataset.supCancelOrder;
        await cancelSupplierOrder(mosqueId, viewDate, 'supplier');
        toast('تم إلغاء الطلب');
        await bumpNotifSite(['supplier','supplierorder'], mosqueId);
        renderSupplierMain();
      });
    });
    Array.from(document.querySelectorAll('[data-sup-receive]')).forEach(b=>{
      b.addEventListener('click', async ()=>{
        const mosqueId = b.dataset.supReceive;
        const latest = await loadRecord(mosqueId, viewDate);
        if(latest.supplierRecordSaved){ toast('لا يمكن التراجع بعد حفظ الجدول', 'err'); return; }
        latest.supplierOrderReceived = !latest.supplierOrderReceived;
        latest.supplierOrderReceivedTime = latest.supplierOrderReceived ? nowTime12raw() : '';
        if(!latest.supplierOrderReceived){ latest.supplierExecutedTime = ''; latest.supplierShortfallCounted = false; }
        const ok = await storageSet(recKey(mosqueId, viewDate), JSON.stringify(latest));
        if(ok) toast(latest.supplierOrderReceived ? 'تم تسجيل استلام الطلب' : 'تم التراجع عن استلام الطلب'); else toast('تعذر الحفظ، حاول مرة أخرى','err');
        renderSupplierMain();
      });
    });
  }, 5000);
}

async function renderWarehouseMain(){

  rec.returnEntries.forEach(en=>{

  });
  main.innerHTML = `

      ${L.returnSection.visible!==false ? `
      <h3 style="margin-top:18px">${L.returnSection.label}</h3>

        <select class="input" id="whNewReturnDriver" style="max-width:200px">${driverOptionsHTML}</select>
        <input type="number" min="0" class="input" style="max-width:130px" id="whNewReturnQty" placeholder="${L.returnQty.label}">
        <button type="button" class="btn btn-primary btn-sm" id="whAddReturnBtn">+ إضافة</button>
      </div>` : ''}
      <table class="kv-table" style="margin-top:18px">
        <tr><td><strong>السائق</strong></td><td><strong>${L.supplySection.label}</strong></td><td><strong>${L.returnSection.label}</strong></td></tr>

        <tr>
          <td>${d.name}</td>
          <td>
            <span class="row gap-sm" style="align-items:center">
              <input type="number" min="0" class="input" style="width:80px;color:var(--green);font-weight:700" data-wh-edit-supply="${driverId}" value="${d.supply}">
              <button type="button" class="icon-btn" title="حذف" data-wh-del-supply="${driverId}">✕</button>
            </span>
          </td>
          <td>
            <span class="row gap-sm" style="align-items:center">
              <input type="number" min="0" class="input" style="width:80px;color:var(--red);font-weight:700" data-wh-edit-return="${driverId}" value="${d.ret}">
              <button type="button" class="icon-btn" title="حذف" data-wh-del-return="${driverId}">✕</button>
            </span>

      </table>
    </div>
    ${L.totalDistributed.visible!==false ? `
    <div class="card" style="margin-top:16px">
      <table class="kv-table">
        <tr><td>${L.supplySection.label}</td><td><span class="kv-readonly" style="color:var(--green);font-weight:700">${rec.supplyEntries.reduce((s,en)=>s+(Number(en.qty)||0),0)}+</span></td></tr>
        <tr><td>${L.returnSection.label}</td><td><span class="kv-readonly" style="color:var(--red);font-weight:700">${rec.returnEntries.reduce((s,en)=>s+(Number(en.qty)||0),0)}-</span></td></tr>
        <tr><td>${L.totalDistributed.label}</td><td><span class="kv-readonly" style="font-weight:800">${rec.supplyEntries.reduce((s,en)=>s+(Number(en.qty)||0),0) - rec.returnEntries.reduce((s,en)=>s+(Number(en.qty)||0),0)}</span></td></tr>
      </table>
    </div>` : ''}

      renderWarehouseMain();

      const mine = latest.returnEntries.filter(en=>(en.driverId||'_none')===driverId);

function renderRecorderLimitTarget(cfg, rec){
  const wrap = document.getElementById('recLimitTargetCard');
  if(!wrap) return;
  const fr = cfg.fridge;
  const totalWithdrawn = (rec.withdrawals||[]).reduce((s,w)=>s+(Number(w.qty)||0),0);
  const rows = [];
  if(fr.limitLabel.visible!==false && fr.limitValue>0){
    const limit = fr.limitValue;
    const pct = Math.round((totalWithdrawn/limit)*100);
    const left = limit - totalWithdrawn;
    const warn = totalWithdrawn>limit ? `<div style="color:#fff;background:var(--red);display:inline-block;padding:2px 8px;border-radius:6px;margin-top:4px;font-size:12px;font-weight:700">⚠️ تجاوز بمقدار ${totalWithdrawn-limit}</div>` : '';
    rows.push(`<div><strong>${fr.limitLabel.label}:</strong> ${limit} <span class="muted small">(${pct}% — تم سحب: ${totalWithdrawn} — المتبقي: ${left>0?left:0})</span>${warn}</div>`);
  }
  if(fr.targetLabel.visible!==false && fr.targetValue>0){
    const target = fr.targetValue;
    const totalForTarget = totalWithdrawn + (rec.tankerWithdrawals||[]).reduce((s,w)=>s+(Number(w.qty)||0),0);
    const pct = Math.round((totalForTarget/target)*100);
    const reached = totalForTarget >= target;
    const mark = (reached || fr.targetFailMarkVisible===false) ? '' : ` <span style="color:var(--red);font-weight:900">${fr.targetFailMark}</span>`;
    const msg = (reached && fr.targetMessageVisible!==false) ? `<div style="color:#fff;background:var(--green);display:inline-block;padding:2px 8px;border-radius:6px;margin-top:4px;font-size:12px;font-weight:700">✅ ${fr.targetSuccessMessage}${(totalForTarget-target)>0?` وتجاوز الهدف بـ (${totalForTarget-target}) كرتون`:''}</div>` : '';
    rows.push(`<div style="margin-top:8px"><strong>${fr.targetLabel.label}:</strong> ${target}${mark} <span class="muted small">(${pct}%)</span>${msg}</div>`);
  }
  wrap.innerHTML = rows.length ? rows.join('') : `<p class="muted small">لا يوجد حد مانع أو هدف مفعّل لهذا الموقع.</p>`;
}

async function renderSupplierOrderPage(main, mosqueId){
  main.innerHTML = `<div class="empty-state">جارٍ التحميل…</div>`;
  const m = mosqueById(mosqueId);
  const L = getSupplierOrderLabels(mosqueId);
  if(!state.supOrderDate || state.supOrderDate < state.today) state.supOrderDate = state.today;
  async function refresh(justUpdate){
    await loadMosques(); // pick up supplierShortfall changes made by المورد in another session
    const orderDate = state.supOrderDate;
    const rec = await loadRecord(mosqueId, orderDate);
    const cfg = getFormConfig(mosqueId);
    const limitVal = cfg.fridge.limitValue || 0;
    const live = await computeLiveSupplierQty(mosqueId, orderDate); // informational only (أيام السحب) — never auto-fills the manual quantity
    const manualVal = rec.supplierOrderConfirmed ? (rec.orderRequestedQty||0) : (rec.pendingManualQty||0);
    const shortfall = mosqueById(mosqueId).supplierShortfall || 0;
    const locked = !!rec.supplierOrderReceived;
    if(justUpdate){
      const wasPendingShown = !!document.getElementById('spPendingNote');
      const isPendingNow = !!(rec.orderPendingGsApproval && !rec.supplierOrderConfirmed);
      if(wasPendingShown !== isPendingNow){ refresh(false); return; }
      const daysEl = document.getElementById('spDays');
      if(daysEl) daysEl.innerHTML = daysBreakdownHTML(live.days);
      const manualInputEl = document.getElementById('spManualInput');
      if(manualInputEl && document.activeElement!==manualInputEl) manualInputEl.value = manualVal;
      const shortEl = document.getElementById('spShortfallWrap');
      if(shortEl) shortEl.innerHTML = shortfallControlHTML(shortfall, L, rec.supplierOrderConfirmed);
      const timeEl = document.getElementById('spTime');
      if(timeEl && document.activeElement!==timeEl) timeEl.value = rec.supplierArrivalTime||'';
      const confirmEl = document.getElementById('spConfirm');

function updateStats(){
  const gv = (id)=>{ const el=document.getElementById(id); return el ? (Number(el.value)||0) : null; };
  const opening = gv('f_opening') ?? (supRecord.openingStock||0);
  const news = gv('f_new') ?? (supRecord.newCartons||0);
  const totalWithdrawn = supRecord.withdrawals.reduce((s,w)=>s+(Number(w.qty)||0),0);
  const remaining = opening + news - totalWithdrawn;
  const twEl = document.getElementById('f_totalWithdrawn');
  if(twEl) twEl.textContent = totalWithdrawn;
  const remainEl = document.getElementById('f_remaining');
  if(remainEl){
    remainEl.textContent = remaining;
    remainEl.style.color = remaining<0 ? 'var(--red)' : 'var(--deep)';
  }
  const capacity = getFormConfig(state.currentUser.mosqueId).fridge.capacityValue || 0;
  const capEl = document.getElementById('f_capacityPercent');
  if(capEl){
    if(capacity>0){
      const pct = Math.round((remaining/capacity)*100);
      const diff = remaining - capacity;
      capEl.textContent = `(${pct}% / ${diff>0?'+':''}${diff})`;
    } else {
      capEl.textContent = '';
    }
  }
  const limitCfg = getFormConfig(state.currentUser.mosqueId).fridge;
  const capValueEl = document.getElementById('f_capacityValue');
  if(capValueEl) capValueEl.textContent = limitCfg.capacityValue||0;
  const capLabelEl = document.getElementById('f_capacityLabelCell');
  if(capLabelEl) capLabelEl.textContent = limitCfg.capacityLabel.label;
  const limitValueEl = document.getElementById('f_limitValue');
  if(limitValueEl) limitValueEl.textContent = limitCfg.limitValue||0;
  const limitLabelEl = document.getElementById('f_limitLabelCell');
  if(limitLabelEl) limitLabelEl.textContent = limitCfg.limitLabel.label;
  const targetValueEl = document.getElementById('f_targetValue');
  if(targetValueEl) targetValueEl.textContent = limitCfg.targetValue||0;
  const targetLabelEl = document.getElementById('f_targetLabelCell');
  if(targetLabelEl) targetLabelEl.textContent = limitCfg.targetLabel.label;
  const limit = limitCfg.limitValue || 0;
  const limitStatsEl = document.getElementById('f_limitStats');
  const limitWarnEl = document.getElementById('f_limitWarning');
  if(limitStatsEl){
    if(limit>0){
      const pct = Math.round((totalWithdrawn/limit)*100);
      const left = limit - totalWithdrawn;
      limitStatsEl.textContent = `(${pct}% — تم سحب: ${totalWithdrawn} — المتبقي: ${left>0?left:0})`;
      if(limitWarnEl){
        limitWarnEl.innerHTML = totalWithdrawn>limit
          ? `<div style="color:#fff;background:var(--red);display:inline-block;padding:3px 10px;border-radius:6px;margin-top:6px;font-weight:700">⚠️ تم تجاوز الحد المانع بمقدار ${totalWithdrawn-limit} كرتون</div>`
          : '';
      }
    } else {
      limitStatsEl.textContent = '';
      if(limitWarnEl) limitWarnEl.innerHTML = '';
    }
  }
  const target = limitCfg.targetValue || 0;
  const tankerWithdrawnForTarget = (supRecord.tankerWithdrawals||[]).reduce((s,w)=>s+(Number(w.qty)||0),0);
  const totalWithdrawnForTarget = totalWithdrawn + tankerWithdrawnForTarget;
  const targetMarkEl = document.getElementById('f_targetMark');
  const targetStatsEl = document.getElementById('f_targetStats');
  const targetMsgEl = document.getElementById('f_targetMessage');
  if(targetStatsEl){
    if(target>0){
      const pct = Math.round((totalWithdrawnForTarget/target)*100);
      targetStatsEl.textContent = `(${pct}%)`;
      const reached = totalWithdrawnForTarget >= target;
      if(targetMarkEl) targetMarkEl.innerHTML = (reached || limitCfg.targetFailMarkVisible===false) ? '' : `<span style="color:var(--red);font-weight:900">${limitCfg.targetFailMark}</span>`;
      if(targetMsgEl){
        if(reached && limitCfg.targetMessageVisible!==false){
          const over = totalWithdrawnForTarget - target;
          targetMsgEl.innerHTML = `<div style="color:#fff;background:var(--green);display:inline-block;padding:3px 10px;border-radius:6px;margin-top:6px;font-weight:700">✅ ${limitCfg.targetSuccessMessage}${over>0?` وتجاوز الهدف بـ (${over}) كرتون`:''}</div>`;
        } else {
          targetMsgEl.innerHTML = '';
        }
      }
    } else {
      targetStatsEl.textContent = '';
      if(targetMarkEl) targetMarkEl.innerHTML = '';
      if(targetMsgEl) targetMsgEl.innerHTML = '';
    }
  }

  const received = gv('f_qtyReceived') ?? (supRecord.qtyReceived||0);
  const distributed = (supRecord.tankerWithdrawals||[]).reduce((s,w)=>s+(Number(w.qty)||0),0);
  supRecord.qtyDistributed = distributed;
  const distEl = document.getElementById('f_qtyDistributed');
  if(distEl) distEl.textContent = distributed;
  const surplus = received - distributed;
  const surplusEl = document.getElementById('f_qtySurplus');
  if(surplusEl){
    surplusEl.textContent = surplus;
    surplusEl.style.color = surplus<0 ? 'var(--red)' : 'var(--deep)';
  }
}

function burnTimestampOnImage(dataUrl){
  return new Promise((resolve)=>{
    const img = new Image();
    img.onload = ()=>{
      const canvas = document.createElement('canvas');
      canvas.width = img.width; canvas.height = img.height;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img,0,0);
      const text = nowTime12();
      const fontSize = Math.max(18, Math.round(img.width*0.032));
      ctx.font = `bold ${fontSize}px Tajawal, Arial, sans-serif`;
      const barHeight = Math.round(fontSize*2);
      ctx.fillStyle = 'rgba(0,0,0,0.6)';
      ctx.fillRect(0, img.height-barHeight, img.width, barHeight);
      ctx.fillStyle = '#ffffff';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(text, img.width/2, img.height-barHeight/2);
      resolve(canvas.toDataURL('image/jpeg', 0.85));
    };
    img.onerror = ()=>resolve(dataUrl);
    img.src = dataUrl;
  });
}

async function saveSupervisorRecord(){
  const m = mosqueById(state.currentUser.mosqueId);
  if(m && m.paused){
    toast('هذا الموقع متوقف مؤقتًا عن استقبال تقارير جديدة','err');
    return;
  }
  const missing = [];
  const cfgForSave = getFormConfig(m.id);
  const openingEl = document.getElementById('f_opening');
  if(cfgForSave.fridge.visible!==false && (!openingEl || openingEl.value==='')){ missing.push('تسجيل الرصيد الابتدائي (كرتون)'); }
  const fridgeQtyTotal = (supRecord.withdrawals||[]).reduce((s,w)=>s+(Number(w.qty)||0),0);
  const tankerQty = (supRecord.tankerWithdrawals||[]).reduce((s,w)=>s+(Number(w.qty)||0),0);
  const fridgeOn = cfgForSave.fridge.visible!==false, tankersOn = cfgForSave.tankers.visible!==false;
  if(fridgeOn && tankersOn && fridgeQtyTotal<=0 && tankerQty<=0){ missing.push('تسجيل سحوبات اليوم (ثلاجة أو ناقلات ماء)'); }
  else if(fridgeOn && !tankersOn && fridgeQtyTotal<=0){ missing.push('تسجيل سحوبات اليوم (ثلاجة)'); }
  else if(!fridgeOn && tankersOn && tankerQty<=0){ missing.push('تسجيل سحوبات اليوم (ناقلات ماء)'); }
  if(!supRecord.entryPhoto){ missing.push('رفع صورة الدخول'); }
  if(!supRecord.exitPhoto){ missing.push('رفع صورة الخروج'); }
  if(fridgePhotoVisible(cfgForSave) && !supRecord.fridgePhoto){ missing.push('رفع صورة الثلاجة'); }
  const collabList = state.collaborators.filter(c=>c.mosqueId===m.id).filter(c=>!(c.transferLockedUntil && state.today < c.transferLockedUntil));
  if(collabList.length && collabList.some(c=>!(supRecord.attendance && supRecord.attendance[c.id]))){
    missing.push('تعبئة جدول تحضير المتعاونين بالكامل');
  }
  if(!supRecord.waterColdness){ missing.push('تقييم برودة الماء'); }
  if(!supRecord.actionPoints || !supRecord.actionPoints.length){ missing.push('إضافة نقطة فعالة واحدة على الأقل'); }
  if(missing.length){
    toast('لا يمكن الحفظ — الحقول الناقصة: ' + missing.join('، '), 'err');
    return;
  }
  const btn = document.getElementById('saveBtn');
  btn.disabled = true; btn.textContent = 'جارٍ الحفظ...';
  const gv = (id)=>{ const el=document.getElementById(id); return el ? el.value : null; };
  const numOr = (id, fallback)=>{ const v = gv(id); return v!==null ? (Number(v)||0) : fallback; };
  const strOr = (id, fallback)=>{ const v = gv(id); return v!==null ? v : fallback; };
  supRecord.openingStock = numOr('f_opening', supRecord.openingStock||0);
  supRecord.newCartons = numOr('f_new', supRecord.newCartons||0);
  supRecord.tankerArrival = strOr('f_tankerTime', supRecord.tankerArrival||'');
  supRecord.tankerCount = numOr('f_tankerCount', supRecord.tankerCount||0);
  supRecord.qtyReceived = numOr('f_qtyReceived', supRecord.qtyReceived||0);
  supRecord.qtyDistributed = (supRecord.tankerWithdrawals||[]).reduce((s,w)=>s+(Number(w.qty)||0),0);
  supRecord.distributionStart = strOr('f_distStart', supRecord.distributionStart||'');
  supRecord.distributionEnd = strOr('f_distEnd', supRecord.distributionEnd||'');
  supRecord.notes = strOr('f_notes', supRecord.notes||'');
  if(!supRecord.supervisorNameOverride && state.currentUser && state.currentUser.name){
    supRecord.supervisorNameOverride = state.currentUser.name;
  }
  supRecord.savedAt = new Date().toISOString();
  supRecord.gsApproved = false;
  supRecord.gsApprovedAt = '';
  supRecord.gsApprovedBy = '';
  const mosqueId = state.currentUser.mosqueId;
  // merge in any withdrawal entries added concurrently by مسجل بيانات users, so saving here never erases their work
  try{
    const latest = await loadRecord(mosqueId, state.supDate);
    ['withdrawals','tankerWithdrawals'].forEach(key=>{
      const localIds = new Set((supRecord[key]||[]).map(w=>w.id).filter(Boolean));
      (latest[key]||[]).forEach(w=>{
        if(w.id && !localIds.has(w.id)) supRecord[key].push(w);
      });
    });
  }catch(e){ /* best-effort merge; proceed with save regardless */ }
  const ok = await storageSet(recKey(mosqueId, state.supDate), JSON.stringify(supRecord));
  btn.disabled = false; btn.textContent = 'حفظ بيانات اليوم';
  if(ok){
    toast('تم حفظ بيانات اليوم بنجاح ✓');
    await bumpNotif(['approvereports']);
  } else toast('تعذر الحفظ، حاول مرة أخرى','err');
}
