<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <script src="[https://unpkg.com/@supabase/supabase-js@2](https://unpkg.com/@supabase/supabase-js@2)"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light only">
<title>ضيف المدينة · نظام إدارة توزيع مياه المساجد</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@500;700;800;900&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --deep:#17256E;
    --teal:#3B4A8F;
    --gold:#2A3778;
    --indigo:#3B4A8F;
    --sand:#E7E9F5;
    --sand-light:#F6F7FB;
    --ink:#151A33;
    --ink-soft:#5A5F7A;
    --green:#2F9E44;
    --red:#D6483F;
    --line:#D9DCEC;
    --white:#FFFFFF;
    --radius:16px;
    --shadow: 0 6px 24px rgba(23,37,110,0.10);
  }
  :root{color-scheme:light;}
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--sand-light);}
  body{
    background:var(--sand-light);
    background-image:
      radial-gradient(circle at 100% 0%, rgba(23,37,110,0.06), transparent 40%),
      radial-gradient(circle at 0% 100%, rgba(23,37,110,0.05), transparent 40%);
    color:var(--ink);
    font-family:'IBM Plex Sans Arabic', sans-serif;
    min-height:100vh;
  }
  h1,h2,h3,.display{font-family:'Tajawal',sans-serif;}
  button{font-family:inherit;cursor:pointer;}
  input,select,textarea{font-family:inherit;}
  ::selection{background:rgba(28,140,147,0.25);}

  /* ---------- utility ---------- */
  .row{display:flex;align-items:center;}
  .col{display:flex;flex-direction:column;}
  .gap-sm{gap:8px;} .gap-md{gap:14px;} .gap-lg{gap:22px;}
  .wrap{flex-wrap:wrap;}
  .grow{flex:1;}
  .muted{color:var(--ink-soft);}
  .small{font-size:12.5px;}

  .btn{
    border:none;border-radius:12px;padding:11px 18px;font-weight:600;font-size:14.5px;
    display:inline-flex;align-items:center;gap:8px;transition:.15s transform, .15s box-shadow;
  }
  .btn:active{transform:scale(0.97);}
  .btn-primary{background:var(--deep);color:#fff;}
  .btn-primary:hover{box-shadow:0 4px 14px rgba(23,37,110,.35);}
  .btn-gold{background:var(--gold);color:#fff;}
  .btn-ghost{background:transparent;color:var(--deep);border:1.5px solid var(--line);}
  .btn-ghost:hover{border-color:var(--deep);}
  .btn-danger{background:#fff;color:var(--red);border:1.5px solid #f0c9c6;}
  .btn-sm{padding:7px 12px;font-size:13px;border-radius:9px;}
  .btn:disabled{opacity:.5;cursor:not-allowed;}

  .card{
    background:var(--white);border-radius:var(--radius);box-shadow:var(--shadow);
    border:1px solid #EFE9DA;padding:22px;
  }
  .label{font-size:13px;font-weight:600;color:var(--ink-soft);margin-bottom:6px;display:block;}
  .input, select.input, textarea.input{
    width:100%;padding:11px 13px;border-radius:10px;border:1.5px solid var(--line);
    background:#fff;font-size:14.5px;color:var(--ink);outline:none;transition:.15s border-color;
  }
  .input:focus{border-color:var(--teal);}
  textarea.input{resize:vertical;min-height:80px;}

  .badge{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:700;padding:5px 11px;border-radius:999px;}
  .badge-ok{background:#EAF7EC;color:var(--green);}
  .badge-no{background:#FBEAE9;color:var(--red);}
  .badge-neutral{background:#E7E9F5;color:var(--indigo);}

  .check-circle,.cross-circle,.dash-circle{
    width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;
    font-weight:900;font-size:16px;flex-shrink:0;border:2px solid transparent;
  }
  .check-circle{background:#EAF7EC;color:var(--green);border-color:#BFE7C6;}
  .double-shift-circle{background:#1E5631;color:#ffffff;border-color:#1E5631;}
  .cross-circle{background:#FBEAE9;color:var(--red);border-color:#F2C6C2;}
  .dash-circle{background:#F2F0EA;color:#A7A198;border-color:#E4DFD3;}

  .hours-circle{
    width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;
    font-weight:800;font-size:14px;flex-shrink:0;border:2px solid #000;background:#fff;color:#000;
    cursor:pointer;transition:background .12s,color .12s;
  }
  .hours-circle.active{background:var(--deep);border-color:var(--deep);color:#fff;}
  .hours-circle[disabled]{cursor:default;}

  /* ---------- login ---------- */
  .login-shell{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;}
  .login-card{width:100%;max-width:400px;background:var(--white);border-radius:20px;box-shadow:0 20px 60px rgba(23,37,110,.18);
    padding:34px 30px;border:1px solid #EFE9DA;}
  .logo-badge{width:74px;height:74px;border-radius:20px;background:linear-gradient(160deg,var(--deep),var(--teal));
    display:flex;align-items:center;justify-content:center;margin:0 auto 16px;overflow:hidden;box-shadow:0 8px 20px rgba(23,37,110,.35);}
  .logo-badge img{width:100%;height:100%;object-fit:cover;}
  .brand-title{text-align:center;font-size:26px;font-weight:900;color:var(--deep);margin:0;}
  .brand-sub{text-align:center;color:var(--ink-soft);font-size:13.5px;margin:4px 0 26px;}
  .login-error{background:#FBEAE9;color:var(--red);padding:10px 12px;border-radius:10px;font-size:13.5px;margin-bottom:14px;display:none;}
  .demo-hint{margin-top:20px;border-top:1px dashed var(--line);padding-top:14px;font-size:12px;color:var(--ink-soft);line-height:2;}
  .demo-hint b{color:var(--ink);}

  /* ---------- shell ---------- */
  .topbar{
    background:var(--deep);color:#fff;padding:14px 26px;display:flex;align-items:center;justify-content:space-between;
    position:sticky;top:0;z-index:30;box-shadow:0 4px 18px rgba(0,0,0,.15);
  }
  .topbar .brand{display:flex;align-items:center;gap:10px;font-family:'Tajawal';font-weight:800;font-size:19px;}
  .topbar .brand .dot{width:32px;height:32px;border-radius:9px;background:rgba(255,255,255,.15);display:flex;align-items:center;justify-content:center;overflow:hidden;}
  .topbar .brand .dot img{width:100%;height:100%;object-fit:cover;}
  .topbar .date-pill{background:rgba(255,255,255,.12);border-radius:999px;padding:7px 16px;font-size:13px;font-weight:600;}
  .topbar .user-chip{display:flex;align-items:center;gap:10px;}
  .topbar .user-chip .name{font-size:13.5px;font-weight:700;}
  .topbar .user-chip .role{font-size:11px;color:rgba(255,255,255,.65);}

  .shell-body{display:flex;min-height:calc(100vh - 62px);}
  .sidebar{width:230px;background:#fff;border-left:1px solid #EFE9DA;padding:18px 12px;flex-shrink:0;}
  .side-item{display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:11px;font-size:14px;font-weight:600;
    color:var(--ink-soft);margin-bottom:4px;transition:.15s;}
  .side-item:hover{background:#F5F1E6;}
  .side-item.active{background:var(--deep);color:#fff;}
  .side-item.has-notif{color:var(--red);}
  .side-item.has-notif.active{color:#fff;}
  .notif-badge{background:var(--red);color:#fff;font-size:11px;font-weight:800;min-width:19px;height:19px;border-radius:10px;
    display:inline-flex;align-items:center;justify-content:center;padding:0 5px;margin-inline-start:auto;}
  .notif-dot{background:var(--red);width:10px;height:10px;border-radius:50%;display:inline-block;margin-inline-start:auto;}
  .notif-bell{position:relative;cursor:default;}
  .notif-bell .notif-badge{position:absolute;top:-6px;right:-8px;margin:0;}
  .main{flex:1;padding:26px 30px;max-width:1180px;}

  /* mosque arch tabs */
  .mosque-tabs{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:20px;}
  .mosque-tab{
    position:relative;padding:12px 22px 11px;border-radius:999px 999px 10px 10px;border:2px solid var(--line);
    background:#fff;font-weight:700;font-size:14px;color:var(--ink-soft);display:flex;align-items:center;gap:8px;
  }
  .mosque-tab .finial{width:8px;height:8px;border-radius:50%;}
  .mosque-tab.active{color:#fff;border-color:transparent;}

  table{width:100%;border-collapse:collapse;font-size:13.8px;}
  th{text-align:right;color:var(--ink-soft);font-weight:700;padding:10px 12px;border-bottom:2px solid var(--line);font-size:12.6px;}
  td{padding:12px;border-bottom:1px solid #F1ECE0;vertical-align:middle;}
  tr:last-child td{border-bottom:none;}

  .stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:22px;}
  .kv-table{width:100%;border-collapse:collapse;}
  .kv-table td{padding:9px 4px;border-bottom:1px solid #F1ECE0;vertical-align:middle;}
  .kv-table tr:last-child td{border-bottom:none;}
  .kv-table td:first-child{color:var(--ink-soft);font-size:13.5px;font-weight:700;width:52%;padding-left:10px;}
  .kv-table input{width:100%;}
  .kv-readonly{font-family:'Tajawal';font-weight:900;color:var(--deep);font-size:17px;}
  .kv-readonly-input{font-family:'Tajawal';font-weight:900;color:var(--deep) !important;border:none !important;background:transparent !important;padding:0 !important;font-size:17px;width:100%;}

  .month-table-wrap{overflow-x:auto;margin-bottom:22px;border:1px solid var(--line);border-radius:12px;}
  .month-table{width:100%;border-collapse:collapse;min-width:920px;font-size:12.5px;}
  .month-table .mt-col-label{width:150px;}
  .month-table th,.month-table td{border:1px solid var(--line);padding:7px 8px;text-align:center;white-space:nowrap;}
  .month-table .week-bar td{background:var(--deep);color:#fff;font-weight:800;font-size:13.5px;padding:8px;}
  .month-table thead.mt-head th{background:var(--sand-light);font-weight:700;font-size:11.5px;}
  .month-table .mt-label{background:var(--sand-light);font-weight:700;text-align:right;padding-right:10px;}
  .month-table .mt-total-row td{background:#EEF0F9;font-weight:900;color:var(--deep);}
  .month-table .mt-source-row td{color:var(--ink-soft);font-size:11px;font-style:italic;}
  .month-table .mt-na{color:#C9CCDA;}
  .month-summary-table{width:100%;border-collapse:collapse;font-size:13px;}
  .month-summary-table th,.month-summary-table td{border:1px solid var(--line);padding:8px 10px;text-align:center;}
  .month-summary-table thead th{background:var(--deep);color:#fff;font-weight:700;}
  .month-summary-table tbody tr:nth-child(odd){background:var(--sand-light);}
  .month-summary-table .mt-total-row td{background:#EEF0F9;font-weight:900;color:var(--deep);}

  .indicator-row{margin-bottom:18px;}
  .indicator-row .ind-label{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;font-weight:700;font-size:14px;}
  .indicator-row .ind-track{background:var(--sand-light);border-radius:10px;height:26px;overflow:hidden;border:1px solid var(--line);}
  .indicator-row .ind-fill{height:100%;border-radius:10px 0 0 10px;display:flex;align-items:center;padding-right:10px;color:#fff;font-weight:800;font-size:12.5px;white-space:nowrap;transition:width .3s;}
  .indicator-legend{display:flex;flex-wrap:wrap;gap:14px;margin-top:18px;padding-top:14px;border-top:1px solid var(--line);}
  .indicator-legend .leg-item{display:flex;align-items:center;gap:8px;font-size:13.5px;font-weight:600;}
  .indicator-legend .leg-dot{width:14px;height:14px;border-radius:50%;display:inline-block;}
  .stat-card{background:#fff;border-radius:14px;padding:16px 18px;border:1px solid #EFE9DA;box-shadow:var(--shadow);}
  .stat-card .v{font-family:'Tajawal';font-weight:900;font-size:26px;color:var(--deep);}
  .stat-card .l{font-size:12.5px;color:var(--ink-soft);font-weight:600;margin-top:2px;}

  .receipt-card{border:1px solid #EFE9DA;border-radius:16px;padding:20px;background:#fff;box-shadow:var(--shadow);position:relative;overflow:hidden;}
  .receipt-card::after{
    content:"";position:absolute;bottom:0;left:0;right:0;height:9px;
    background-image:radial-gradient(circle, var(--sand-light) 4px, transparent 4.2px);
    background-size:16px 16px;background-position:bottom -4px right 0;
  }
  .file-drop{border:2px dashed var(--line);border-radius:12px;padding:18px;text-align:center;cursor:pointer;transition:.15s;}
  .file-drop:hover{border-color:var(--teal);background:#F1F2FA;}
  .thumb{width:100%;max-height:170px;object-fit:cover;border-radius:10px;margin-top:10px;cursor:zoom-in;}
  .thumb-wrap{position:relative;display:inline-block;width:100%;}
  .thumb-del{
    position:absolute;top:18px;left:8px;background:rgba(20,26,51,0.82);color:#fff;border:none;
    border-radius:8px;padding:6px 10px;font-size:12px;font-weight:700;cursor:pointer;display:flex;align-items:center;gap:4px;
  }
  .thumb-del:hover{background:var(--red);}
  .lightbox-overlay{
    position:fixed;inset:0;background:rgba(10,13,30,0.92);z-index:999;display:none;
    align-items:center;justify-content:center;flex-direction:column;padding:20px;
  }
  .lightbox-overlay.open{display:flex;}
  .lightbox-imgwrap{overflow:auto;max-width:100%;max-height:78vh;touch-action:pinch-zoom;}
  .lightbox-imgwrap img{display:block;transition:transform .15s ease;transform-origin:center center;max-width:none;}
  .lightbox-bar{position:absolute;top:16px;left:16px;right:16px;display:flex;justify-content:space-between;align-items:center;gap:10px;}
  .lightbox-btn{
    background:rgba(255,255,255,0.12);color:#fff;border:1px solid rgba(255,255,255,0.3);
    border-radius:10px;width:42px;height:42px;font-size:18px;font-weight:800;cursor:pointer;
    display:flex;align-items:center;justify-content:center;
  }
  .lightbox-btn:hover{background:rgba(255,255,255,0.24);}
  .lightbox-controls{display:flex;gap:8px;}

  .withdraw-row{display:flex;gap:10px;align-items:center;margin-bottom:8px;}
  .withdraw-row .input{flex:1;}
  .icon-btn{background:#FBEAE9;color:var(--red);border:none;width:34px;height:34px;border-radius:9px;font-weight:900;flex-shrink:0;}

  .toast-wrap{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);z-index:100;display:flex;flex-direction:column;gap:8px;align-items:center;}
  .toast{background:var(--ink);color:#fff;padding:12px 20px;border-radius:12px;font-size:13.5px;font-weight:600;box-shadow:0 8px 20px rgba(0,0,0,.25);
    animation:toastin .2s ease;}
  .toast.err{background:var(--red);}
  .toast.ok{background:var(--green);}
  @keyframes toastin{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}

  .empty-state{text-align:center;padding:50px 20px;color:var(--ink-soft);}
  .empty-state .big{font-size:40px;margin-bottom:10px;}

  .archive-banner{background:#FDF4E3;color:#8A6416;border:1px solid #F0DBA6;padding:10px 14px;border-radius:10px;font-size:13px;font-weight:600;
    margin-bottom:18px;display:flex;align-items:center;gap:8px;}

  @media(max-width:860px){
    .shell-body{flex-direction:column;}
    .sidebar{width:100%;display:flex;overflow-x:auto;border-left:none;border-bottom:1px solid #EFE9DA;}
    .side-item{white-space:nowrap;}
    .stat-grid{grid-template-columns:repeat(2,1fr);}
    .main{padding:18px;}
    .row{flex-wrap:wrap;}
    table{display:block;max-width:100%;overflow-x:auto;-webkit-overflow-scrolling:touch;}
  }
  :focus-visible{outline:3px solid var(--teal);outline-offset:2px;}
  #printAreaWrap{position:fixed;top:-99999px;left:-99999px;}
  #printArea{padding:0;}
  #printArea h1{font-size:15px;margin:0 0 2px;}
  #printArea h2{font-size:13px;margin:0 0 4px;}
  #printArea h3{font-size:11px;margin:0 0 5px;}
  #printArea p{margin:2px 0;}
  #printArea .col.gap-lg{gap:7px !important;}
  #printArea .row.gap-lg{gap:7px !important;}
  #printArea .card, #printArea .receipt-card{padding:7px 9px !important;margin-bottom:0 !important;box-shadow:none !important;border:1px solid #ddd !important;border-radius:8px !important;}
  #printArea .stat-grid{gap:6px !important;margin-bottom:7px !important;}
  #printArea .stat-card{padding:5px 7px !important;border-radius:8px !important;}
  #printArea .stat-card .v{font-size:14px !important;}
  #printArea .stat-card .l{font-size:8.5px !important;}
  #printArea .kv-table td{padding:3px 4px !important;font-size:10px !important;}
  #printArea .kv-readonly{font-size:11.5px !important;}
  #printArea .kv-readonly-input{font-size:11.5px !important;color:var(--deep) !important;}
  #printArea table{width:100%;border-collapse:collapse;font-size:9.5px;}
  #printArea th,#printArea td{border:1px solid #ccc;padding:3px 6px;}
  #printArea .thumb{width:100px !important;height:100px !important;max-height:100px !important;object-fit:contain !important;background:#f2f0ea;border-radius:6px;margin-top:4px;}
  #printArea .card.grow{min-width:130px !important;}
  #printArea .thumb-del{display:none !important;}
  #printArea .hours-circle{width:22px !important;height:22px !important;font-size:10px !important;}
  #printArea .hours-circle.active{
    background:#fff !important;color:var(--deep) !important;font-weight:900 !important;
    border-color:var(--deep) !important;
  }
  #printArea .badge{font-size:9px;padding:2px 6px;}
  #printArea .month-table-wrap{margin-bottom:8px !important;border-radius:6px !important;overflow:visible !important;}
  #printArea .month-table{min-width:0 !important;width:100%;font-size:8.5px;table-layout:fixed;}
  #printArea .month-table .mt-col-label{width:15%;}
  #printArea .month-table th,#printArea .month-table td{padding:2px 3px !important;overflow-wrap:break-word;}
  #printArea .month-table .week-bar td{padding:4px !important;font-size:10px !important;}
  #printArea .month-summary-table{font-size:9px;}
  #printArea .month-summary-table th,#printArea .month-summary-table td{padding:3px 5px !important;}

  #printArea.print-tight{font-size:6px !important;}
  #printArea.print-tight h1{font-size:11px !important;}
  #printArea.print-tight .month-table-wrap{margin:0 auto 2px !important;max-width:94% !important;}
  #printArea.print-tight .month-table{font-size:5.2px !important;table-layout:fixed;}
  #printArea.print-tight .month-table th,#printArea.print-tight .month-table td{padding:0.5px 1px !important;line-height:1.15;}
  #printArea.print-tight .month-table col.mt-col-label{width:15%;}
  #printArea.print-tight .month-table .week-bar td{padding:1px !important;font-size:6px !important;}
  .attend-day-btn{width:22px;height:22px;font-size:10px;border-radius:50%;border:1px solid var(--line);display:inline-flex;align-items:center;justify-content:center;padding:0;line-height:1;}
  #printArea.print-tight .attend-day-btn{width:7px !important;height:7px !important;font-size:4px !important;border-width:0.5px !important;}
  #printArea.print-tight .month-summary-table{font-size:5.5px !important;max-width:94%;margin:0 auto !important;}
  #printArea.print-tight .month-summary-table th,#printArea.print-tight .month-summary-table td{padding:1px 2px !important;line-height:1.15;}
  #printArea.print-tight h3{font-size:7px !important;margin:0 0 1.5px !important;}
  #printArea.print-tight p{font-size:5.5px !important;margin:0 0 3px !important;}
  #printArea.print-tight .card{padding:3px 5px !important;margin-bottom:3px !important;}
  #printArea.print-tight .kv-readonly{font-size:8px !important;}
  #printArea.print-tight .kv-readonly-input{font-size:8px !important;}
  #printArea.print-tight .label{font-size:5px !important;margin-bottom:1px !important;}
  #printArea.print-tight .muted.small{font-size:5px !important;}
  #printArea.print-tight .indicator-legend{gap:6px !important;margin-top:6px !important;padding-top:4px !important;}
  #printArea.print-tight .indicator-legend .leg-item{font-size:6px !important;gap:3px !important;}
  #printArea.print-tight .indicator-legend .leg-dot{width:7px !important;height:7px !important;}
  #printArea.print-tight svg{max-height:42vh !important;width:100% !important;}
  #printArea.print-tight .row.gap-lg,#printArea.print-tight .col.gap-lg{gap:3px !important;}
  #printArea.print-tight .row.gap-sm{gap:3px !important;}

  #printArea.print-wide{
    max-width:277mm;margin:0 auto;font-size:14px;
  }
  #printArea.print-wide h1{font-size:22px !important;margin:0 0 4px !important;}
  #printArea.print-wide > div:first-child{margin-bottom:16px !important;}
  #printArea.print-wide > div:first-child > div{font-size:14px !important;}
  #printArea.print-wide h3{font-size:16px !important;margin:0 0 8px !important;}
  #printArea.print-wide p.muted{font-size:12px !important;margin:0 0 12px !important;}
  #printArea.print-wide .month-table-wrap{margin:0 auto 16px !important;border-radius:10px !important;box-shadow:0 2px 8px rgba(23,37,110,0.06);}
  #printArea.print-wide .month-table{font-size:13px !important;}
  #printArea.print-wide .month-table th,#printArea.print-wide .month-table td{padding:8px 10px !important;}
  #printArea.print-wide .month-table .week-bar td{padding:11px !important;font-size:15px !important;}
  #printArea.print-wide .month-summary-table{font-size:14px !important;margin:0 auto;}

let MOSQUES = [

  {id:'miqat', name:'مسجد الميقات', color:'#2FAE4E', active:true, createdMonth:null, deletedMonth:null, deletedAt:null, deactivatedUserIds:[]},
  {id:'qiblatain', name:'مسجد القبلتين', color:'#2F6FE0', active:true, createdMonth:null, deletedMonth:null, deletedAt:null, deactivatedUserIds:[]},
];
function mosqueById(id){ return MOSQUES.find(m=>m.id===id); }
function activeMosques(){ return MOSQUES.filter(m=>m.active!==false); }
function sortMosquesByOrder(list, order){
  if(!order || !order.length) return list;
  const idx = id => { const i = order.indexOf(id); return i===-1 ? 999 : i; };
  return [...list].sort((a,b)=> idx(a.id)-idx(b.id));
}
function mosquesForMonth(yyyymm){
  return MOSQUES.filter(m=>{
    if(m.createdMonth && yyyymm < m.createdMonth) return false;
    if(m.active===false){
      if(!m.deletedMonth) return false;
      return yyyymm <= m.deletedMonth;
    }
    return true;
  });
}

/* ============ DATE HELPERS ============ */
function pad(n){return String(n).padStart(2,'0');}
function toStr(d){return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;}
function todayStr(){return toStr(new Date());}
function addDays(dateStr,n){
  const [y,m,d] = dateStr.split('-').map(Number);
  const dt = new Date(y,m-1,d);
  dt.setDate(dt.getDate()+n);
  return toStr(dt);
}
function oneMonthBack(dateStr){
  const [y,m,d] = dateStr.split('-').map(Number);
  const dt = new Date(y,m-1,d);
  dt.setMonth(dt.getMonth()-1);
  return toStr(dt);
}
function humanDate(dateStr){
  const [y,m,d] = dateStr.split('-').map(Number);
  const dt = new Date(y,m-1,d);
  try{
    return toEnglishDigits(new Intl.DateTimeFormat('ar-SA-u-ca-gregory-nu-latn',{weekday:'long',year:'numeric',month:'long',day:'numeric'}).format(dt));
  }catch(e){
    return dt.toDateString();
  }
}
function humanDateNoDay(dateStr){
  const [y,m,d] = dateStr.split('-').map(Number);
  const dt = new Date(y,m-1,d);
  try{
    return toEnglishDigits(new Intl.DateTimeFormat('ar-SA-u-ca-gregory-nu-latn',{year:'numeric',month:'long',day:'numeric'}).format(dt));
  }catch(e){
    return dt.toDateString();
  }
}
function dayNameOnly(dateStr){
  const [y,m,d] = dateStr.split('-').map(Number);
  const dt = new Date(y,m-1,d);
  try{ return toEnglishDigits(new Intl.DateTimeFormat('ar-SA-u-nu-latn',{weekday:'long'}).format(dt)); }catch(e){return '';}
}
function toEnglishDigits(str){
  const eastern = '٠١٢٣٤٥٦٧٨٩';
  return String(str).replace(/[٠-٩]/g, d => eastern.indexOf(d));
}
function hijriDate(dateStr){
  const [y,m,d] = dateStr.split('-').map(Number);
  const dt = new Date(y,m-1,d);
  try{
    return toEnglishDigits(new Intl.DateTimeFormat('ar-SA-u-ca-islamic-nu-latn',{year:'numeric',month:'long',day:'numeric'}).format(dt));
  }catch(e){ return ''; }
}
function formatTime12(t){
  if(!t) return '';
  const parts = t.split(':');
  const h = Number(parts[0]), m = Number(parts[1]||0);
  if(isNaN(h)) return t;
  const period = h>=12 ? 'م' : 'ص';
  let h12 = h % 12; if(h12===0) h12 = 12;
  return `${h12}:${String(m).padStart(2,'0')} ${period}`;
}

/* ============ STORAGE HELPERS ============ */
/* Uses Claude's built-in persistent storage when this page runs inside a
   Claude artifact. When opened as a normal downloaded/hosted HTML file
   (window.storage isn't available there), it falls back to the browser's
   own localStorage so the app still works and still remembers data. */
const memoryFallback = {};
function hasClaudeStorage(){
  return typeof window !== 'undefined' && window.storage && typeof window.storage.get === 'function';
}
async function storageGet(key){
  if(hasClaudeStorage()){
    try{
      const r = await window.storage.get(key, true);
      if(r && r.value != null) return r.value;
    }catch(e){ /* fall through to local fallback */ }
  }
  try{
    const v = localStorage.getItem('saqya::'+key);
    if(v != null) return v;
  }catch(e){ /* localStorage unavailable, e.g. sandboxed iframe */ }
  return memoryFallback[key] !== undefined ? memoryFallback[key] : null;
}
async function storageSet(key, val){
  let ok = false;
  if(hasClaudeStorage()){
    try{
      const r = await window.storage.set(key, val, true);
      ok = !!r;
    }catch(e){ ok = false; }
  }
  try{
    localStorage.setItem('saqya::'+key, val);
    ok = true;
  }catch(e){ /* ignore */ }
  memoryFallback[key] = val;
  return true;
}
function safeParse(str, fallback){
  if(!str) return fallback;
  try{ return JSON.parse(str); }catch(e){ return fallback; }
}

async function computeDriverDayTotals(driverId, date){
  const whRec = await loadWarehouseRecord(date);
  const supplyEntries = whRec.supplyEntries.filter(en=>en.driverId===driverId);
  const supplied = supplyEntries.reduce((s,en)=>s+(Number(en.qty)||0),0);
  const sites = activeMosques();
  let returned = 0, delivered = 0;
  const returnEntries = [];
  for(const m of sites){
    const r = await loadDriverRecord(driverId, m.id, date);
    const q = Number(r.returnQty)||0;
    const dq = Number(r.deliveredQty)||0;
    returned += q;
    delivered += dq;
    if(q>0) returnEntries.push({siteName:m.name, qty:q, time:r.returnTime||''});
  }
  return {supplied, returned, delivered, net: delivered-returned, supplyEntries, returnEntries};
}

/* ============ IMAGE COMPRESSION ============ */
function compressImage(file, maxW=1000, quality=0.72){
  return new Promise((resolve,reject)=>{
    const reader = new FileReader();
    reader.onload = e=>{
      const img = new Image();
      img.onload = ()=>{
        let w=img.width, h=img.height;
        if(w>maxW){ h=Math.round(h*maxW/w); w=maxW; }
        const canvas=document.createElement('canvas');
        canvas.width=w; canvas.height=h;
        canvas.getContext('2d').drawImage(img,0,0,w,h);
        resolve(canvas.toDataURL('image/jpeg',quality));
      };
      img.onerror=()=>reject(new Error('image load failed'));
      img.src = e.target.result;
    };
    reader.onerror=()=>reject(new Error('read failed'));
    reader.readAsDataURL(file);
  });
}
let pdfJsLoadingPromise = null;
function loadPdfJsIfNeeded(){
  if(window.pdfjsLib) return Promise.resolve();
  if(pdfJsLoadingPromise) return pdfJsLoadingPromise;
  pdfJsLoadingPromise = new Promise((resolve,reject)=>{
    const s = document.createElement('script');
    s.src = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js';
    s.onload = ()=>{
      window.pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
      resolve();
    };
    s.onerror = ()=>reject(new Error('failed to load pdf.js'));
    document.head.appendChild(s);
  });
  return pdfJsLoadingPromise;
}
async function extractImageFromPdf(file){
  await loadPdfJsIfNeeded();
  const arrayBuffer = await file.arrayBuffer();
  const pdf = await window.pdfjsLib.getDocument({data: arrayBuffer}).promise;
  const page = await pdf.getPage(1);
  const viewport = page.getViewport({scale: 2});
  const canvas = document.createElement('canvas');
  canvas.width = viewport.width;
  canvas.height = viewport.height;
  const ctx = canvas.getContext('2d');
  await page.render({canvasContext: ctx, viewport}).promise;
  return canvas.toDataURL('image/jpeg', 0.85);
}

/* ============ LIGHTBOX (zoomable image viewer) ============ */
(function initLightbox(){
  const overlay = document.getElementById('lightboxOverlay');
  const img = document.getElementById('lightboxImg');
  const wrap = document.getElementById('lightboxImgWrap');
  let scale = 1;
  function applyScale(){ img.style.transform = `scale(${scale})`; }
  function open(src){
    img.src = src;
    scale = 1;
    applyScale();
    overlay.classList.add('open');
  }
  function close(){
    overlay.classList.remove('open');
    img.src = '';
  }
  document.addEventListener('click', e=>{
    const t = e.target.closest('img.thumb');
    if(t && t.getAttribute('src')) open(t.getAttribute('src'));
  });
  document.getElementById('lightboxClose').addEventListener('click', close);
  overlay.addEventListener('click', e=>{ if(e.target===overlay) close(); });
  document.getElementById('lightboxZoomIn').addEventListener('click', ()=>{ scale = Math.min(scale+0.4, 4); applyScale(); });
  document.getElementById('lightboxZoomOut').addEventListener('click', ()=>{ scale = Math.max(scale-0.4, 0.6); applyScale(); });
  document.getElementById('lightboxZoomReset').addEventListener('click', ()=>{ scale = 1; applyScale(); });
  document.getElementById('lightboxSave').addEventListener('click', ()=>{
    const src = img.src;
    if(!src) return;
    const mimeMatch = src.match(/^data:([^;]+);/);
    const mime = mimeMatch ? mimeMatch[1] : 'image/jpeg';
    let ext = 'jpg';
    if(mime.includes('pdf')) ext = 'pdf';
    else if(mime.includes('png')) ext = 'png';
    else if(mime.includes('jpeg')||mime.includes('jpg')) ext = 'jpg';
    else if(mime.includes('/')) ext = mime.split('/')[1];
    const a = document.createElement('a');
    a.href = src;
    a.download = `مرفق-${Date.now()}.${ext}`;
    document.body.appendChild(a);
    a.click();
    a.remove();
    toast('تم بدء الحفظ');
  });
  wrap.addEventListener('wheel', e=>{
    if(!overlay.classList.contains('open')) return;
    e.preventDefault();
    scale = Math.min(Math.max(scale + (e.deltaY<0?0.2:-0.2), 0.6), 4);
    applyScale();
  }, {passive:false});
  document.addEventListener('keydown', e=>{ if(e.key==='Escape' && overlay.classList.contains('open')) close(); });
})();

async function doLogin(){
  const u = document.getElementById('loginUser').value.trim();
  const p = document.getElementById('loginPass').value;
  const errEl = document.getElementById('loginError');
  await loadUsers();
  const found = state.users.find(x=>x.username===u && x.password===p);
  if(!found){
    errEl.textContent = 'اسم المستخدم أو كلمة المرور غير صحيحة.';
    errEl.style.display='block';
    return;
  }
  if(found.active===false){
    errEl.textContent = 'تم إيقاف هذا الحساب. يرجى مراجعة الإدارة.';
    errEl.style.display='block';
    return;
  }
  state.currentUser = found;
  state.supDate = state.today;
  await Promise.all([loadCollaborators(), loadLogo(), loadMosques()]);
  renderApp();
}
function logout(){
  state.currentUser = null;
  if(recorderRefreshInterval){ clearInterval(recorderRefreshInterval); recorderRefreshInterval = null; }
  if(liveSaveInterval){ clearInterval(liveSaveInterval); liveSaveInterval = null; }
  if(withdrawSyncInterval){ clearInterval(withdrawSyncInterval); withdrawSyncInterval = null; }
  if(heartbeatInterval){ clearInterval(heartbeatInterval); heartbeatInterval = null; }
  if(supplierRefreshInterval){ clearInterval(supplierRefreshInterval); supplierRefreshInterval = null; }
  if(supplierOrderRefreshInterval){ clearInterval(supplierOrderRefreshInterval); supplierOrderRefreshInterval = null; }
  if(gsSupplierOrderRefreshInterval){ clearInterval(gsSupplierOrderRefreshInterval); gsSupplierOrderRefreshInterval = null; }
  if(fcSyncInterval){ clearInterval(fcSyncInterval); fcSyncInterval = null; }
  if(collabsPendingPollInterval){ clearInterval(collabsPendingPollInterval); collabsPendingPollInterval = null; }
  if(sharedSettingsPollInterval){ clearInterval(sharedSettingsPollInterval); sharedSettingsPollInterval = null; }
  if(notifPollInterval){ clearInterval(notifPollInterval); notifPollInterval = null; }
  renderLogin();
}

/* ============ APP SHELL ============ */
let heartbeatInterval = null;
async function logVisit(u){
  try{
    const raw = await storageGet('skq_visits__'+u.id);
    let arr = raw ? safeParse(raw, []) : [];
    if(!Array.isArray(arr)) arr = [];
    arr.push(new Date().toISOString());
    if(arr.length>10) arr = arr.slice(arr.length-10);
    await storageSet('skq_visits__'+u.id, JSON.stringify(arr));
  }catch(e){}
}
function startHeartbeat(){
  if(heartbeatInterval) clearInterval(heartbeatInterval);
  const u0 = state.currentUser;
  if(u0) logVisit(u0);
  const send = ()=>{
    const u = state.currentUser;
    if(!u) return;
    storageSet('skq_presence__'+u.id, JSON.stringify({name:u.name, role:u.role, mosqueId:u.mosqueId||null, lastSeen: new Date().toISOString()}));
  };
  send();
  heartbeatInterval = setInterval(send, 15000);
}
async function renderApp(){
  startHeartbeat();
  await Promise.all([loadNotifCounters(), loadNotifSeenCounters()]);
  if(state.currentUser.role === 'admin') renderAdminShell();
  else if(state.currentUser.role === 'recorder') renderRecorderShell();
  else if(state.currentUser.role === 'general_supervisor') renderGeneralSupervisorShell();
  else if(state.currentUser.role === 'supplier') renderSupplierShell();
  else if(state.currentUser.role === 'warehouse') renderWarehouseShell();
  else if(state.currentUser.role === 'driver') renderDriverShell();
  else renderSupervisorShell();
  startNotifPolling();
}
let notifPollInterval = null;
function refreshBellBadge(){
  const bell = document.querySelector('.notif-bell');
  const total = notifTotalUnread();
  const topbarEl = document.querySelector('.topbar .row.gap-md');
  if(total>0 && !bell && topbarEl){
    const datePill = topbarEl.querySelector('.date-pill');
    if(datePill) datePill.insertAdjacentHTML('afterend', `<div class="notif-bell" style="font-size:20px" title="إشعارات جديدة">🔔<span class="notif-badge">${total>99?'99+':total}</span></div>`);
  } else if(total>0 && bell){
    const b = bell.querySelector('.notif-badge');
    if(b) b.textContent = total>99?'99+':total;
  } else if(total===0 && bell){
    bell.remove();
  }
}
function startNotifPolling(){
  if(notifPollInterval) clearInterval(notifPollInterval);
  notifPollInterval = setInterval(async ()=>{
    if(!state.currentUser || !document.body.contains(document.querySelector('.topbar'))){ clearInterval(notifPollInterval); notifPollInterval = null; return; }
    await loadNotifCounters();
    refreshBellBadge();
    // refresh sidebar item badges
    Array.from(document.querySelectorAll('[data-side], [data-gs-side]')).forEach(el=>{
      const key = el.dataset.side || el.dataset.gsSide;
      const unread = notifUnreadCount(key);
      let badge = el.querySelector('.notif-badge');
      if(unread>0){
        el.classList.add('has-notif');
        if(badge) badge.textContent = unread>99?'99+':unread;
        else el.insertAdjacentHTML('beforeend', `<span class="notif-badge">${unread>99?'99+':unread}</span>`);
      } else {
        el.classList.remove('has-notif');
        if(badge) badge.remove();
      }
    });
    Array.from(document.querySelectorAll('[data-sup-side]')).forEach(el=>{
      const key = el.dataset.supSide==='daily' ? 'reports' : 'supplierorder';
      const unread = notifUnreadCount(key);
      let badge = el.querySelector('.notif-badge');
      if(unread>0){
        el.classList.add('has-notif');
        if(badge) badge.textContent = unread>99?'99+':unread;
        else el.insertAdjacentHTML('beforeend', `<span class="notif-badge">${unread>99?'99+':unread}</span>`);
      } else {
        el.classList.remove('has-notif');
        if(badge) badge.remove();
      }
    });
  }, 6000);
}
function topbarHTML(){
  const u = state.currentUser;
  const totalUnread = notifTotalUnread();
  return `
  <div class="topbar">
    <div class="brand">
      <div class="dot">${state.logo ? `<img src="${state.logo}">` : ''}</div>
      <span style="font-size:19px">${state.siteName}</span>
    </div>
    <div class="row gap-md">
      <div class="date-pill">${humanDate(state.today)}</div>
      ${(u.role==='admin' || u.role==='general_supervisor') ? `<button type="button" class="btn btn-ghost btn-sm" id="topbarRefreshBtn" style="color:#fff;border-color:rgba(255,255,255,.35)">🔄 تحديث الصفحة</button>` : ''}
      ${totalUnread>0 ? `<div class="notif-bell" style="font-size:20px" title="إشعارات جديدة">🔔<span class="notif-badge">${totalUnread>99?'99+':totalUnread}</span></div>` : ''}
      <div class="user-chip">
        <div class="col" style="align-items:flex-end">
          <span class="name">${u.name}</span>
          <span class="role">${u.role==='admin' ? 'الإدارة' : u.role==='general_supervisor' ? state.roleLabels.general_supervisor : u.role==='supplier' ? state.roleLabels.supplier : u.role==='warehouse' ? state.roleLabels.warehouse : u.role==='driver' ? state.roleLabels.driver : mosqueById(u.mosqueId)?.name || 'مشرف'}</span>
        </div>
        <button class="btn btn-ghost btn-sm" id="logoutBtn" style="color:#fff;border-color:rgba(255,255,255,.35)">خروج</button>
      </div>
    </div>
  </div>`;
}
function bindTopbar(){
  document.getElementById('logoutBtn').addEventListener('click', logout);
  const refreshBtn = document.getElementById('topbarRefreshBtn');
  if(refreshBtn) refreshBtn.addEventListener('click', async ()=>{
    refreshBtn.disabled = true;
    await refreshAllData();
    refreshBtn.disabled = false;
    toast('تم تحديث الصفحة');
    if(state.currentUser.role==='admin') renderAdminShell();
    else if(state.currentUser.role==='general_supervisor') renderGeneralSupervisorShell();
  });
}
async function refreshAllData(){
  await Promise.all([loadUsers(), loadCollaborators(), loadLogo(), loadMosques(), loadSiteName(), loadSiteSubtitle(), loadShowDemoHint(), loadDemoHintText(), loadReportBackgrounds(), loadPdfOrientations(), loadPdfSizing(), loadFormConfigs(), loadSidebarLabels(), loadSidebarOrder(), loadMonthlyOrderLabels(), loadIndicatorLabels(), loadCollabLabels(), loadBgModeLabels(), loadModePillLabels(), loadRoleLabels(), loadReportHeaderConfig(), loadMonthlyColumnLabels(), loadMonthlyTableVisibility(), loadAttendLog(), loadPresenceSettings(), loadPendingCollaborators(), loadGsSidebarOrder(), loadNotifCounters(), loadNotifSeenCounters(), loadSupplierOrderLabels(), loadSupplierAccountLabels(), loadWarehouseLabels(), loadDriverLabels()]);
}

/* ============ ADMIN ============ */
function renderAdminShell(){
  app.innerHTML = `
    ${topbarHTML()}
    <div class="shell-body">
      <div class="sidebar">
        ${state.sidebarOrder.map(k=>adminSideItem(k,state.sidebarLabels[k])).join('')}
      </div>
      <div class="main" id="adminMain"></div>
    </div>`;
  bindTopbar();
  Array.from(document.querySelectorAll('[data-side]')).forEach(el=>{
    el.addEventListener('click', async ()=>{
      state.adminTab = el.dataset.side;
      if(state.adminTab!=='livereports' && liveReportRefreshInterval){ clearInterval(liveReportRefreshInterval); liveReportRefreshInterval = null; }
      if(state.adminTab!=='online' && onlineUsersRefreshInterval){ clearInterval(onlineUsersRefreshInterval); onlineUsersRefreshInterval = null; }
      if(state.adminTab!=='supplier' && supplierViewRefreshInterval){ clearInterval(supplierViewRefreshInterval); supplierViewRefreshInterval = null; }
      Array.from(document.querySelectorAll('[data-side]')).forEach(x=>{
        x.classList.toggle('active', x.dataset.side===state.adminTab);
      });
      await markNotifSeen(state.adminTab);
      el.classList.remove('has-notif');
      const badge = el.querySelector('.notif-badge, .notif-dot');
      if(badge) badge.remove();
      refreshBellBadge();
      renderAdminMain();
    });
  });
  renderAdminMain();
}
const DOT_ONLY_NOTIF_KEYS = new Set(['reports','attendlog','monthly']);
function sideItemBadgeHTML(key){
  const unread = notifUnreadCount(key);
  if(unread<=0) return '';
  if(DOT_ONLY_NOTIF_KEYS.has(key)) return `<span class="notif-dot"></span>`;
  return `<span class="notif-badge">${unread>99?'99+':unread}</span>`;
}
function adminSideItem(key,label){
  const unread = notifUnreadCount(key);
  const badge = sideItemBadgeHTML(key);
  return `<div class="side-item ${state.adminTab===key?'active':''} ${unread>0?'has-notif':''}" data-side="${key}">${label}${badge}</div>`;
}
function renderAdminMain(){
  const main = document.getElementById('adminMain');
  if(state.adminTab==='users') return renderAdminUsers(main);
  if(state.adminTab==='collabs') return renderAdminCollabs(main);
  if(state.adminTab==='reports') return renderAdminReports(main);
  if(state.adminTab==='livereports') return renderAdminLiveReports(main);
  if(state.adminTab==='attendlog') return renderAttendLogPage(main);
  if(state.adminTab==='online') return renderOnlineUsersPage(main);
  if(state.adminTab==='supplier') return renderSupplierViewPage(main);
  if(state.adminTab==='supplierlog') return renderAdminSupplierLog(main);
  if(state.adminTab==='warehouseadmin') return renderWarehouseViewPage(main);
  if(state.adminTab==='driveradmin') return renderDriverViewPage(main);
  if(state.adminTab==='monthly') return renderAdminMonthly(main);
  if(state.adminTab==='indicator') return renderAdminIndicator(main);
  if(state.adminTab==='private') return renderAdminPrivateInfo(main);
}

async function addUser(){
  const name = document.getElementById('nu_name').value.trim();
  const username = document.getElementById('nu_user').value.trim();
  const password = document.getElementById('nu_pass').value;
  const role = document.getElementById('nu_role').value;
  const mosqueId = (role==='admin' || role==='general_supervisor' || role==='supplier' || role==='warehouse' || role==='driver') ? null : document.getElementById('nu_mosque').value;
  if(!name || !username || !password){ toast('الرجاء تعبئة جميع الحقول','err'); return; }
  if(state.users.some(u=>u.username===username)){ toast('اسم المستخدم مستخدم مسبقاً','err'); return; }
  state.users.push({id:'u_'+Date.now(), name, username, password, role, mosqueId, active:true});
  const ok = await storageSet('skq_users', JSON.stringify(state.users));
  if(ok){ toast('تمت إضافة الحساب بنجاح'); renderAdminUsers(document.getElementById('adminMain')); }
  else toast('تعذر الحفظ، حاول مرة أخرى','err');
}
async function toggleUser(id){
  const u = state.users.find(x=>x.id===id); if(!u) return;
  u.active = u.active===false ? true : false;
  await storageSet('skq_users', JSON.stringify(state.users));
  renderUsersTable();
}
async function delUser(id){
  state.users = state.users.filter(x=>x.id!==id);
  await storageSet('skq_users', JSON.stringify(state.users));
  renderUsersTable();
  toast('تم حذف الحساب');
}

let collabsPendingPollInterval = null;
function renderCollabCounts(){
  const wrap = document.getElementById('collabCountsGrid');
  if(!wrap) return;
  const jobOptions = (state.collabLabels.jobTitleOptions||[]).filter(o=>o.visible!==false);
  function jobBreakdownHTML(list){
    if(!jobOptions.length) return '';
    const rows = jobOptions.map(o=>{
      const n = list.filter(c=>(c.customFields&&c.customFields.col_job_title)===o.label).length;
      return `<div class="row" style="justify-content:space-between;font-size:12px;margin-top:4px"><span class="muted">${o.label}</span><strong>${n}</strong></div>`;
    }).join('');
    return `<div style="width:100%;margin-top:8px;border-top:1px dashed var(--line);padding-top:6px">${rows}</div>`;
  }
  const cards = [];
  if(!state.collabCountHidden.all){
    cards.push(`<div class="stat-card"><div class="v">${state.collaborators.length}</div><div class="l">${state.collabLabels.allLabel}</div>${jobBreakdownHTML(state.collaborators)}</div>`);
  }
  activeMosques().forEach(m=>{
    if(state.collabCountHidden[m.id]) return;
    const list = state.collaborators.filter(c=>c.mosqueId===m.id);
    cards.push(`<div class="stat-card"><div class="v">${list.length}</div><div class="l">${m.name}</div>${jobBreakdownHTML(list)}</div>`);
  });
  if(!state.collabCountHidden.noSite){
    const noSiteList = state.collaborators.filter(c=>!c.mosqueId);
    cards.push(`<div class="stat-card"><div class="v">${noSiteList.length}</div><div class="l">${state.collabLabels.noSiteCountLabel}</div>${jobBreakdownHTML(noSiteList)}</div>`);
  }
  wrap.innerHTML = cards.join('') || `<p class="muted small">كل البطاقات موقوفة حاليًا — يمكن التحكم بها من معلومات خاصة ← جدول المتعاونين.</p>`;
}
function renderCollabsTable(){
  const wrap = document.getElementById('collabsTableWrap');
  const readOnly = false; // مدير النظام now has full edit rights here too, same as مشرف عام
  const customCols = (state.collabLabels.customColumns || []).filter(c=>c.visible!==false);
  const visibleJobOptions = (state.collabLabels.jobTitleOptions||[]).filter(o=>o.visible!==false);
  function customCellHTML(c, cc){
    if(cc.type==='select'){
      const cur = (c.customFields&&c.customFields[cc.id]) || '';
      return `<td><select class="input" style="min-width:120px" data-custom-select="${c.id}:${cc.id}" ${readOnly?'disabled':''}>
        <option value="">—</option>
        ${visibleJobOptions.map(o=>`<option value="${o.label}" ${o.label===cur?'selected':''}>${o.label}</option>`).join('')}
      </select></td>`;
    }
    return `<td><input class="input" style="min-width:120px" data-custom-field="${c.id}:${cc.id}" value="${(c.customFields&&c.customFields[cc.id])||''}" ${readOnly?'disabled':''}></td>`;
  }
  const orderedMosques = sortMosquesByOrder(activeMosques(), state.monthlyMosqueOrder);
  const mosqueRank = {};
  orderedMosques.forEach((m,i)=>{ mosqueRank[m.id] = i; });
  const jobRank = {};
  (state.collabLabels.jobTitleOptions||[]).forEach((o,i)=>{ jobRank[o.label] = i; });
  const sortedCollaborators = [...state.collaborators].sort((a,b)=>{
    const ra = a.mosqueId!=null && mosqueRank[a.mosqueId]!==undefined ? mosqueRank[a.mosqueId] : 999;
    const rb = b.mosqueId!=null && mosqueRank[b.mosqueId]!==undefined ? mosqueRank[b.mosqueId] : 999;
    if(ra !== rb) return ra - rb;
    const ja = (a.customFields && jobRank[a.customFields.col_job_title]!==undefined) ? jobRank[a.customFields.col_job_title] : 999;
    const jb = (b.customFields && jobRank[b.customFields.col_job_title]!==undefined) ? jobRank[b.customFields.col_job_title] : 999;
    return ja - jb;
  });
  wrap.innerHTML = `
    <table>
      <thead><tr>
        <th>${state.collabLabels.nameCol}</th>
        ${customCols.map(cc=>`<th>${cc.label}</th>`).join('')}
        <th>${state.collabLabels.mosqueCol}</th>
        <th>${state.collabLabels.moveCol}</th>
        <th></th>
      </tr></thead>
      <tbody>
        ${sortedCollaborators.map(c=>{
          const m = mosqueById(c.mosqueId);
          return `
          <tr>
            <td>${c.name}</td>
            ${customCols.map(cc=>customCellHTML(c, cc)).join('')}
            <td><span class="badge badge-neutral" style="display:inline-flex;align-items:center;gap:6px">${m?`<span style="width:9px;height:9px;border-radius:50%;background:${m.color};display:inline-block"></span>`:''}${m?.name || state.collabLabels.noSiteLabel}</span></td>
            <td>
              <select class="input" style="max-width:170px" data-move="${c.id}" ${readOnly?'disabled':''}>
                <option value="" ${!c.mosqueId?'selected':''}>${state.collabLabels.noSiteLabel}</option>
                ${activeMosques().map(mm=>`<option value="${mm.id}" ${mm.id===c.mosqueId?'selected':''}>${mm.name}</option>`).join('')}
              </select>
            </td>
            <td>${readOnly?'':`<button class="btn btn-danger btn-sm" data-del-collab="${c.id}">حذف</button>`}</td>
          </tr>`;
        }).join('')}
      </tbody>
    </table>`;
  Array.from(wrap.querySelectorAll('[data-move]')).forEach(sel=>{
    sel.addEventListener('change', ()=>moveCollab(sel.dataset.move, sel.value || null));
  });
  Array.from(wrap.querySelectorAll('[data-del-collab]')).forEach(b=>b.addEventListener('click', ()=>delCollab(b.dataset.delCollab)));
  Array.from(wrap.querySelectorAll('[data-custom-select]')).forEach(sel=>{
    sel.addEventListener('change', async ()=>{
      const [cid, colId] = sel.dataset.customSelect.split(':');
      const c = state.collaborators.find(x=>x.id===cid);
      if(!c) return;
      if(!c.customFields) c.customFields = {};
      c.customFields[colId] = sel.value;
      await storageSet('skq_collaborators', JSON.stringify(state.collaborators));
      renderCollabCounts();
      if(colId==='col_job_title') renderCollabsTable();
    });
  });
  Array.from(wrap.querySelectorAll('[data-custom-field]')).forEach(inp=>{
    inp.addEventListener('change', async ()=>{
      const [cid, colId] = inp.dataset.customField.split(':');
      const c = state.collaborators.find(x=>x.id===cid);
      if(!c) return;
      if(!c.customFields) c.customFields = {};
      c.customFields[colId] = inp.value;
      await storageSet('skq_collaborators', JSON.stringify(state.collaborators));
    });

  });
}
async function addCollab(){
  const name = document.getElementById('nc_name').value.trim();
  const mosqueId = document.getElementById('nc_mosque').value;
  const jobTitleEl = document.getElementById('nc_jobtitle');
  const nationalIdEl = document.getElementById('nc_nationalid');
  const jobTitle = jobTitleEl ? jobTitleEl.value : '';
  const nationalId = nationalIdEl ? nationalIdEl.value.trim() : '';
  if(!name){ toast('أدخلي اسم المتعاون','err'); return; }
  const main = document.getElementById('adminMain');
  if(state.currentUser.role === 'general_supervisor'){
    state.pendingCollaborators.push({id:'pc_'+Date.now(), name, mosqueId, jobTitle, nationalId, requestedBy: state.currentUser.name, requestedAt: new Date().toISOString()});
    const ok = await savePendingCollaborators();
    if(ok){ toast('تمت إضافة الطلب — بانتظار موافقة مدير النظام'); await bumpNotif(['collabs']); } else toast('تعذر الحفظ، حاول مرة أخرى','err');
    renderAdminCollabs(main);
    return;
  }
  state.collaborators.push({id:'c_'+Date.now(), name, mosqueId, customFields:{col_national_id:nationalId, col_job_title:jobTitle}});
  await storageSet('skq_collaborators', JSON.stringify(state.collaborators));
  toast('تمت إضافة المتعاون');
  renderAdminCollabs(main);
}
async function moveCollab(id, mosqueId){
  const c = state.collaborators.find(x=>x.id===id); if(!c) return;
  const oldMosqueId = c.mosqueId;
  const today = state.today;
  let lockedToday = false;
  if(oldMosqueId){
    const oldRec = await loadRecord(oldMosqueId, today);
    const mark = oldRec.attendance ? oldRec.attendance[id] : null;
    if(mark==='present' || mark==='absent') lockedToday = true;
  }
  if(!c.mosqueHistory) c.mosqueHistory = oldMosqueId ? [{mosqueId: oldMosqueId, since:'0000-01-01'}] : [];
  const effectiveSince = lockedToday ? addDays(today,1) : today;
  c.mosqueHistory.push({mosqueId, since: effectiveSince});
  c.mosqueId = mosqueId;
  c.transferLockedUntil = lockedToday ? effectiveSince : null;
  await storageSet('skq_collaborators', JSON.stringify(state.collaborators));
  toast(lockedToday ? 'تم النقل — بما أنه محضَّر اليوم بالموقع القديم، يمكن تحضيره بالموقع الجديد ابتداءً من الغد' : 'تم نقل المتعاون بنجاح');
  renderCollabsTable();
  renderCollabCounts();
}

async function syncAttendLogRosterForMonth(yyyymm, isCurrentMonth, monthData){
  if(!state.attendLogRoster[yyyymm]) state.attendLogRoster[yyyymm] = [];
  const roster = state.attendLogRoster[yyyymm];
  if(!isCurrentMonth) return;
  state.collaborators.forEach(c=>{
    const m = mosqueById(c.mosqueId);
    const jobTitle = (c.customFields && c.customFields.col_job_title) || '';
    const nationalId = (c.customFields && c.customFields.col_national_id) || '';
    const idx = roster.findIndex(r=>r.id===c.id);
    if(idx===-1){
      roster.push({id:c.id, name:c.name, jobTitle, mosqueId:c.mosqueId, mosqueName:m?m.name:'', nationalId, mosqueHistory:c.mosqueHistory||null});
    } else {
      roster[idx].name = c.name;
      roster[idx].jobTitle = jobTitle;
      roster[idx].mosqueId = c.mosqueId;
      roster[idx].mosqueName = m?m.name:'';
      roster[idx].nationalId = nationalId;
      roster[idx].mosqueHistory = c.mosqueHistory||null;
    }
  });
  for(let i=roster.length-1;i>=0;i--){
    const r = roster[i];
    const stillExists = state.collaborators.find(c=>c.id===r.id);
    if(!stillExists){
      const hasAttendance = Object.keys(monthData[r.mosqueId]||{}).some(dateStr=>{
        const rec = monthData[r.mosqueId][dateStr];
        return rec && rec.savedAt && rec.attendance && rec.attendance[r.id]==='present';
      });
      if(!hasAttendance) roster.splice(i,1);
    }
  }
  const orderedMosques = sortMosquesByOrder(activeMosques(), state.monthlyMosqueOrder);
  const mosqueRank = {};
  orderedMosques.forEach((m,i)=>{ mosqueRank[m.id] = i; });
  const jobRank = {};
  (state.collabLabels.jobTitleOptions||[]).forEach((o,i)=>{ jobRank[o.label] = i; });
  const collabRank = {};
  state.collaborators.forEach((c,i)=>{ collabRank[c.id] = i; });
  roster.sort((a,b)=>{
    const aActive = collabRank[a.id]!==undefined, bActive = collabRank[b.id]!==undefined;
    if(aActive && !bActive) return -1;
    if(!aActive && bActive) return 1;
    if(!aActive && !bActive) return 0; // keep existing relative order for orphaned entries
    const ra = mosqueRank[a.mosqueId]!==undefined ? mosqueRank[a.mosqueId] : 999;
    const rb = mosqueRank[b.mosqueId]!==undefined ? mosqueRank[b.mosqueId] : 999;
    if(ra !== rb) return ra - rb;
    const ja = jobRank[a.jobTitle]!==undefined ? jobRank[a.jobTitle] : 999;
    const jb = jobRank[b.jobTitle]!==undefined ? jobRank[b.jobTitle] : 999;
    return ja - jb;
  });
  await saveAttendLogRoster();
}

async function renderOnlineUsersPage(main){
  if(onlineUsersRefreshInterval){ clearInterval(onlineUsersRefreshInterval); onlineUsersRefreshInterval = null; }
  main.innerHTML = `
    <h2>${state.sidebarLabels.online}</h2>
    <p class="muted small">يتحدث تلقائيًا كل بضع ثوانٍ. اضغط على اسم المستخدم لعرض آخر 10 زيارات.</p>

  `;

    const wrap = document.getElementById('onlineUsersList');
    if(!wrap) return;
    const visibleUsers = state.users.filter(u=>!state.presenceHidden[u.id]).slice().sort((a,b)=>{
      const ra = ONLINE_ROLE_ORDER.indexOf(a.role), rb = ONLINE_ROLE_ORDER.indexOf(b.role);
      if(ra!==rb) return (ra<0?99:ra) - (rb<0?99:rb);
      return (a.name||'').localeCompare(b.name||'','ar');
    });
    const openIds = Array.from(wrap.querySelectorAll('.visit-history-panel[data-open="1"]')).map(el=>el.dataset.uid);
    const rows = await Promise.all(visibleUsers.map(async u=>{
      const raw = await storageGet('skq_presence__'+u.id);
      const p = raw ? safeParse(raw, null) : null;
      const isOnline = p && (Date.now() - new Date(p.lastSeen).getTime()) < 30000;
      const siteName = u.mosqueId ? (mosqueById(u.mosqueId)?.name || '') : 'الإدارة';
      const roleLabel = state.roleLabels[u.role] || u.role;
      const isOpen = openIds.includes(u.id);
      return `<div class="card" style="padding:12px 16px">
        <div class="row" style="justify-content:space-between;align-items:center;flex-wrap:wrap">
          <div>
            <strong class="visit-history-toggle" data-uid="${u.id}" style="cursor:pointer;text-decoration:underline dotted">${u.name}</strong>
            <span class="muted small">— ${roleLabel}${siteName?' — '+siteName:''}</span>
          </div>
          <div style="text-align:left">
            ${isOnline
              ? `<span style="color:var(--green);font-weight:700">● متصل</span>`
              : `<div><span style="color:var(--red);font-weight:700">● غير متصل</span>${p?`<div class="muted small">آخر ظهور: ${lastSeenLabel(new Date(p.lastSeen))}</div>`:''}</div>`}
          </div>
        </div>
        <div class="visit-history-panel" data-uid="${u.id}" data-open="${isOpen?'1':'0'}" style="margin-top:10px;${isOpen?'':'display:none'}">
          <div class="muted small" style="margin-bottom:4px">آخر 10 زيارات</div>
          <div id="visitList_${u.id}" class="muted small">جارٍ التحميل…</div>
        </div>
      </div>`;
    }));
    wrap.innerHTML = rows.join('') || `<p class="muted small">لا يوجد مستخدمون لعرضهم.</p>`;
    Array.from(wrap.querySelectorAll('.visit-history-toggle')).forEach(el=>{
      el.addEventListener('click', async ()=>{
        const uid = el.dataset.uid;
        const panel = wrap.querySelector(`.visit-history-panel[data-uid="${uid}"]`);
        if(!panel) return;
        const nowOpen = panel.dataset.open === '1';
        if(nowOpen){ panel.dataset.open = '0'; panel.style.display = 'none'; return; }
        panel.dataset.open = '1';
        panel.style.display = '';
        const listEl = document.getElementById(`visitList_${uid}`);
        const raw = await storageGet('skq_visits__'+uid);
        let arr = raw ? safeParse(raw, []) : [];
        if(!Array.isArray(arr)) arr = [];
        arr = arr.slice().reverse();
        if(listEl) listEl.innerHTML = arr.length ? arr.map(iso=>{
          const d = new Date(iso);
          const ds = toStr(d);
          const timeStr = toEnglishDigits(new Intl.DateTimeFormat('ar-SA-u-nu-latn',{hour:'numeric',minute:'2-digit'}).format(d));
          return `<div>${dayNameOnly(ds)}، ${humanDateNoDay(ds)} — ${timeStr}</div>`;
        }).join('') : `<div>لا يوجد سجل زيارات بعد.</div>`;
      });
    });
  }
  await refresh();
  onlineUsersRefreshInterval = setInterval(()=>{
    if(document.getElementById('onlineUsersList')) refresh(); else { clearInterval(onlineUsersRefreshInterval); onlineUsersRefreshInterval = null; }
  }, 10000);

async function renderAttendLogPage(main){
  const readOnly = false; // مدير النظام now has full edit rights here too, same as مشرف عام
  if(!state.attendLogMonth) state.attendLogMonth = state.today.slice(0,7);
  main.innerHTML = `<div class="empty-state">جارٍ التحميل…</div>`;
  const yyyymm = state.attendLogMonth;
  const isCurrentMonth = yyyymm === state.today.slice(0,7);
  const monthData = await loadMonthData(yyyymm);
  await syncAttendLogRosterForMonth(yyyymm, isCurrentMonth, monthData);
  const roster = state.attendLogRoster[yyyymm] || [];
  if(!state.attendLogData[yyyymm]) state.attendLogData[yyyymm] = {};
  const dm = state.attendLogData[yyyymm];
  const L = state.attendLogLabels;
  const total = daysInMonth(yyyymm);
  const dayCols = [];
  for(let d=1; d<=total; d++) dayCols.push(monthDateStr(yyyymm, d));

  function isManualJobTitle(jobTitle){
    const opt = (state.collabLabels.jobTitleOptions||[]).find(o=>o.label===jobTitle);
    return !!(opt && opt.manual);
  }
  function mosqueForCollabOnDate(r, dateStr){
    if(!r.mosqueHistory || !r.mosqueHistory.length) return r.mosqueId;
    let effective = r.mosqueHistory[0].mosqueId;
    for(const h of r.mosqueHistory){ if(h.since <= dateStr) effective = h.mosqueId; else break; }
    return effective;
  }
  function actualMarkFor(r, dateStr){
    if(!dm[r.id]) dm[r.id] = {dailyReward:0, contract:null, overrides:{}, manualMarks:{}};
    if(!dm[r.id].manualMarks) dm[r.id].manualMarks = {};
    if(isManualJobTitle(r.jobTitle)){
      return dm[r.id].manualMarks[dateStr] || 'none';
    }
    const effectiveMosqueId = mosqueForCollabOnDate(r, dateStr);
    const rec = monthData[effectiveMosqueId] ? monthData[effectiveMosqueId][dateStr] : null;
    if(!rec || !rec.savedAt || !rec.gsApproved) return 'none';
    const st = rec.attendance ? rec.attendance[r.id] : null;
    if(st==='present') return 'present';
    if(st==='absent') return 'absent';
    return 'none';
  }
  function dayMarkFor(r, dateStr){
    if(!dm[r.id]) dm[r.id] = {dailyReward:0, contract:null, overrides:{}, manualMarks:{}};
    if(isManualJobTitle(r.jobTitle)) return actualMarkFor(r, dateStr);
    if(dm[r.id].overrides[dateStr]==='double' && actualMarkFor(r,dateStr)==='present') return 'double';
    return actualMarkFor(r, dateStr);
  }
  function workDaysFor(r){
    return dayCols.reduce((sum,d)=>{
      const mark = dayMarkFor(r,d);
      if(mark==='double') return sum+2;
      if(mark==='present') return sum+1;
      return sum;
    }, 0);
  }

  const [y,mo] = yyyymm.split('-').map(Number);
  const monthName = toEnglishDigits(new Intl.DateTimeFormat('ar-SA-u-nu-latn',{month:'long',year:'numeric'}).format(new Date(y,mo-1,1)));

  const rows = roster.map((r,i)=>{
    if(!dm[r.id]) dm[r.id] = {dailyReward:0, contract:null, overrides:{}};
    const rd = dm[r.id];
    const workDays = workDaysFor(r);
    const total_reward = workDays * (Number(rd.dailyReward)||0);
    const dayCells = dayCols.map(d=>{
      const mark = dayMarkFor(r,d);
      const symMap = {present:'✅', absent:'❌', double:'2', none:'—'};
      const clsMap = {present:'check-circle', absent:'cross-circle', double:'double-shift-circle', none:'dash-circle'};
      return `<td><button type="button" class="${clsMap[mark]} attend-day-btn" ${readOnly?'disabled':`data-day-cell="${r.id}:${d}"`} title="${readOnly?'':(isManualJobTitle(r.jobTitle)?'اضغط للتنقل بين حاضر/غائب/دوام فترتين/بدون':'اضغط لتبديل دوام فترتين')}">${symMap[mark]}</button></td>`;
    }).join('');
    const contractSym = rd.contract==='yes' ? '✅' : rd.contract==='no' ? '❌' : '';
    return `<tr>
      <td>${i+1}</td>
      <td>${r.jobTitle||'—'}</td>
      <td><button type="button" class="btn btn-ghost btn-sm" ${readOnly?'disabled':`data-contract="${r.id}"`} style="min-width:34px">${contractSym}</button></td>
      <td>${r.name}</td>
      <td>${r.mosqueName||'—'}</td>
      <td>${r.nationalId||'—'}</td>
      ${dayCells}
      <td>${workDays}</td>
      <td><input type="number" min="0" class="input" style="width:90px" ${readOnly?'disabled':`data-daily-reward="${r.id}"`} value="${rd.dailyReward||0}"></td>
      <td>${total_reward}</td>
    </tr>`;
  }).join('');

  const grandTotal = roster.reduce((s,r)=>{ const rd=dm[r.id]||{dailyReward:0}; return s + workDaysFor(r)*(Number(rd.dailyReward)||0); },0);

  main.innerHTML = `
    <h2>${L.title} — ${monthName}</h2>
    <div class="row gap-sm" style="margin-bottom:14px;align-items:center">
      <button class="btn btn-ghost btn-sm" id="attendPrevMonth">◀ الشهر السابق</button>
      <button class="btn btn-ghost btn-sm" id="attendNextMonth" ${isCurrentMonth?'disabled':''}>الشهر التالي ▶</button>
      ${!isCurrentMonth ? `<button class="btn btn-gold btn-sm" id="attendJumpCurrent">الشهر الحالي</button>` : ''}
      <button class="btn btn-primary btn-sm" id="attendExportExcelBtn">📊 نقل إلى إكسل</button>
    </div>
    <div style="overflow-x:auto" id="attendLogTableWrap">
      <table class="month-table">
        <thead>
          <tr>
            <th>${L.colM}</th><th>${L.colTitle}</th><th>${L.colContract}</th><th>${L.colName}</th><th>${L.colSite}</th><th>${L.colNationalId}</th>
            ${dayCols.map(d=>`<th>${dayNameOnly(d)}<br>${d.slice(8,10)}</th>`).join('')}
            <th>${L.colWorkDays}</th><th>${L.colDailyReward}</th><th>${L.colTotalReward}</th>
          </tr>
        </thead>
        <tbody>${rows || `<tr><td colspan="99" class="muted small">لا يوجد متعاونون مسجلون بعد.</td></tr>`}</tbody>
        <tfoot>
          <tr class="mt-total-row"><td colspan="${6+dayCols.length}">${L.totalRewardsLabel}</td><td colspan="3">${grandTotal}</td></tr>
        </tfoot>
      </table>
      <p class="muted small" style="margin-top:10px">
        ✅ ${L.presentLabel} &nbsp;&nbsp; ❌ ${L.absentLabel} &nbsp;&nbsp; — ${L.noAssignLabel} &nbsp;&nbsp; 2 ${L.doubleShiftLabel} &nbsp;&nbsp;
        العقد: ✅ ${L.contractYesLabel} / ❌ ${L.contractNoLabel}
      </p>
    </div>
  `;
  document.getElementById('attendPrevMonth').addEventListener('click', ()=>{
    const [yy,mm] = state.attendLogMonth.split('-').map(Number);
    const d = new Date(yy, mm-2, 1);
    state.attendLogMonth = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
    renderAttendLogPage(main);
  });
  document.getElementById('attendNextMonth').addEventListener('click', ()=>{
    const [yy,mm] = state.attendLogMonth.split('-').map(Number);
    const d = new Date(yy, mm, 1);
    const candidate = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
    if(candidate <= state.today.slice(0,7)) state.attendLogMonth = candidate;
    renderAttendLogPage(main);
  });
  const jumpBtn = document.getElementById('attendJumpCurrent');
  if(jumpBtn) jumpBtn.addEventListener('click', ()=>{ state.attendLogMonth = state.today.slice(0,7); renderAttendLogPage(main); });
  document.getElementById('attendExportExcelBtn').addEventListener('click', ()=>exportAttendLogExcel(monthName, roster, dm, dayCols, L, workDaysFor, dayMarkFor));
  Array.from(main.querySelectorAll('[data-daily-reward]')).forEach(inp=>{
    inp.addEventListener('change', async ()=>{
      const cid = inp.dataset.dailyReward;
      if(!dm[cid]) dm[cid] = {dailyReward:0, contract:null, overrides:{}};
      dm[cid].dailyReward = Number(inp.value)||0;
      await saveAttendLogData();
      renderAttendLogPage(main);
    });
  });
  Array.from(main.querySelectorAll('[data-contract]')).forEach(b=>{
    b.addEventListener('click', async ()=>{
      const cid = b.dataset.contract;
      if(!dm[cid]) dm[cid] = {dailyReward:0, contract:null, overrides:{}};
      const cur = dm[cid].contract;
      dm[cid].contract = cur===null ? 'yes' : cur==='yes' ? 'no' : null;
      await saveAttendLogData();
      renderAttendLogPage(main);
    });
  });
  Array.from(main.querySelectorAll('[data-day-cell]')).forEach(b=>{
    b.addEventListener('click', async ()=>{
      const [cid, dateStr] = b.dataset.dayCell.split(':');
      const r = roster.find(x=>x.id===cid);
      if(!r) return;

        const next = {none:'present', present:'absent', absent:'double', double:'none'}[cur];
        dm[cid].manualMarks[dateStr] = next;
        await saveAttendLogData();
        renderAttendLogPage(main);
        return;
      }
      if(actualMarkFor(r, dateStr)!=='present'){
        toast('دوام فترتين لا يمكن إضافته إلا لمن كان حاضرًا بعلامة صح في ذلك اليوم','err');
        return;
      }
      if(!dm[cid].overrides) dm[cid].overrides = {};
      dm[cid].overrides[dateStr] = dm[cid].overrides[dateStr]==='double' ? undefined : 'double';
      await saveAttendLogData();
      renderAttendLogPage(main);
    });
  });
}
function exportAttendLogExcel(monthName, roster, dm, dayCols, L, workDaysFor, dayMarkFor){
  const headerBg = '#17256E';
  const totalBg = '#EFE9DA';
  const th = (txt)=>`<th style="background:${headerBg};color:#ffffff;font-weight:bold;border:1px solid #999;padding:4px;white-space:nowrap">${txt}</th>`;
  const td = (txt, extra)=>`<td style="border:1px solid #ccc;padding:4px;text-align:center;${extra||''}">${txt}</td>`;
  const dayValueMap = {present:'✓', absent:'✕', double:2, none:'-'};
  const dayBgMap = {present:'#C6EFCE', absent:'#FFC7CE', double:'#375623', none:'#D9D9D9'};
  const dayFgMap = {present:'#006100', absent:'#9C0006', double:'#ffffff', none:'#000000'};
  let html = `<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:x="urn:schemas-microsoft-com:office:excel" xmlns="http://www.w3.org/TR/REC-html40">
    <head><meta charset="UTF-8"></head>
    <body dir="rtl">
    <table style="border-collapse:collapse;font-family:Arial">
      <tr>${th(L.colM)}${th(L.colTitle)}${th(L.colContract)}${th(L.colName)}${th(L.colSite)}${th(L.colNationalId)}
        ${dayCols.map(d=>th(dayNameOnly(d)+'<br>'+d.slice(8,10))).join('')}
        ${th(L.colWorkDays)}${th(L.colDailyReward)}${th(L.colTotalReward)}</tr>`;
  roster.forEach((r,i)=>{
    const rd = dm[r.id] || {dailyReward:0, contract:null};
    const workDays = workDaysFor(r);
    const totalReward = workDays * (Number(rd.dailyReward)||0);
    const contractSym = rd.contract==='yes' ? '✓' : rd.contract==='no' ? '✕' : '';
    html += `<tr>
      ${td(i+1)}${td(r.jobTitle||'')}${td(contractSym)}${td(r.name)}${td(r.mosqueName||'')}${td(r.nationalId||'')}
      ${dayCols.map(d=>{ const mk=dayMarkFor(r,d); return td(dayValueMap[mk], `background:${dayBgMap[mk]};color:${dayFgMap[mk]};font-weight:bold`); }).join('')}
      ${td(workDays)}${td(rd.dailyReward||0)}${td(totalReward)}
    </tr>`;
  });
  const grandTotal = roster.reduce((s,r)=>{ const rd=dm[r.id]||{dailyReward:0}; return s + workDaysFor(r)*(Number(rd.dailyReward)||0); },0);
  html += `<tr>${td(L.totalRewardsLabel, `background:${totalBg};font-weight:bold`)}<td colspan="${5+dayCols.length}" style="border:1px solid #ccc"></td>${td('', `background:${totalBg}`)}${td('', `background:${totalBg}`)}${td(grandTotal, `background:${totalBg};font-weight:bold`)}</tr>`;
  html += `</table>
    <p style="font-family:Arial;font-size:12px;margin-top:10px">✓ ${L.presentLabel} — ✕ ${L.absentLabel} — - ${L.noAssignLabel} — 2 ${L.doubleShiftLabel} — العقد: ✓ ${L.contractYesLabel} / ✕ ${L.contractNoLabel}</p>
    </body></html>`;
  const blob = new Blob(['\ufeff', html], {type:'application/vnd.ms-excel'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `${L.title}_${monthName}.xls`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function setPrintOrientation(orientation){
  let style = document.getElementById('printOrientationOverride');
  if(!style){
    style = document.createElement('style');
    style.id = 'printOrientationOverride';
    document.head.appendChild(style);
  }
  style.textContent = `@media print{ @page{ size:A4 ${orientation}; margin:9mm; } }`;
}
function applyReportBackground(printArea, innerContent, bgDataUrl, vOffset, heightPct, widthPct){
  const vOff = Number(vOffset)||0;
  const hPct = Math.max(20, Math.min(300, Number(heightPct)||100)) / 100;
  const wPct = Math.max(20, Math.min(300, Number(widthPct)||100)) / 100;
  const wrapped = `<div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center">
      <div style="transform:translateY(${vOff}mm) scale(${wPct}, ${hPct});transform-origin:center">${innerContent}</div>
    </div>`;
  if(bgDataUrl){
    printArea.classList.add('print-has-bg');
    return `<img src="${bgDataUrl}" style="position:absolute;top:0;right:0;bottom:0;left:0;width:100%;height:100%;object-fit:cover;z-index:0;">
      ${wrapped}`;
  }
  printArea.classList.remove('print-has-bg');
  return wrapped;
}
function exportReportPDF(){
  const reportContent = document.getElementById('reportContent');
  const printArea = document.getElementById('printArea');
  const temp = document.createElement('div');
  temp.innerHTML = reportContent.innerHTML;
  // remove photo cards that have no attached photo (site attached a "غير مرفقة"/"لا يوجد سند مرفق" badge instead of an image)
  Array.from(temp.querySelectorAll('.card.grow')).forEach(card=>{
    if(card.querySelector('.badge-no')) card.remove();
  });
  // remove the بيان (statement) column entirely from fridge/tanker withdrawal tables in the exported PDF only
  Array.from(temp.querySelectorAll('[data-pdf-strip-block="statement"]')).forEach(block=>block.remove());
  const inner = temp.innerHTML;
  const orientation = state.pdfOrientations.daily || 'portrait';
  printArea.classList.remove('print-tight');
  printArea.classList.toggle('print-wide', orientation!=='portrait');
  printArea.classList.add('print-centered');
  printArea.innerHTML = applyReportBackground(printArea, inner, state.reportBackgrounds.daily, state.pdfVOffset.daily, state.pdfHeightPct.daily, state.pdfWidthPct.daily);
  setPrintOrientation(orientation);
  const originalTitle = document.title;
  document.title = ' ';
  window.print();
  document.title = originalTitle;
}

function attendanceSummaryHTML(list, attendance, mosqueId, customValues, editable){
  const total = list.length;
  let present=0, absent=0, none=0;
  list.forEach(c=>{
    const st = attendance[c.id] || 'none';
    if(st==='present') present++; else if(st==='absent') absent++; else none++;
  });
  const cfg = getFormConfig(mosqueId);
  const stats = cfg.attendance.stats;
  const computed = {total, present, absent, none};
  const colors = {present:'var(--green)', absent:'var(--red)'};
  const cards = [];
  (cfg.attendance.statsOrder||['total','present','absent','none']).forEach(k=>{
    const s = stats[k];
    if(s && s.visible!==false){
      cards.push(`<div class="stat-card"><div class="v"${colors[k]?` style="color:${colors[k]}"`:''}>${computed[k]}</div><div class="l">${s.label}</div></div>`);
    }
  });
  (cfg.attendance.customStats||[]).forEach(s=>{
    if(s.visible===false) return;
    const val = (customValues && customValues[s.id]!==undefined) ? customValues[s.id] : '';
    if(editable){
      cards.push(`<div class="stat-card"><input type="number" class="input" style="text-align:center;font-weight:900;color:var(--deep)" data-custom-stat-input="${s.id}" value="${val}"><div class="l">${s.label}</div></div>`);
    } else {
      cards.push(`<div class="stat-card"><div class="v">${val||'—'}</div><div class="l">${s.label}</div></div>`);
    }
  });
  if(!cards.length) return '';
  return `
    <div class="stat-grid" style="margin-bottom:16px">
      ${cards.join('')}
    </div>`;
}
function renderAttendanceReadonly(mosqueId, attendance, customStatValues, attendanceNotes, attendanceTimestamps, workTimes){
  const manualJobTitles = new Set((state.collabLabels.jobTitleOptions||[]).filter(o=>o.manual).map(o=>o.label));

  const wt = workTimes || {};

    const st = attendance[c.id] || 'none';
    const circle = st==='present' ? '<div class="check-circle">✓</div>' : st==='absent' ? '<div class="cross-circle">✕</div>' : '<div class="dash-circle">–</div>';
    const ts = stamps[c.id] || {};
    const tsBits = [];
    if(ts.present) tsBits.push(`<span class="muted small">وقت الحضور: ${ts.present.display}</span>`);
    if(ts.late && cfg.attendance.lateLabel.visible!==false) tsBits.push(`<span class="muted small">${cfg.attendance.lateLabel.label} — ${ts.late.display}</span>`);
    if(ts.withdrawn && cfg.attendance.withdrawnLabel.visible!==false) tsBits.push(`<span class="small" style="color:var(--red)">${cfg.attendance.withdrawnLabel.label} — ${ts.withdrawn.display}</span>`);
    const times = wt[c.id] || {};
    if(times.start) tsBits.push(`<span class="muted small">${cfg.attendance.workStartLabel.label}: ${formatTime12(times.start)}</span>`);
    if(times.end) tsBits.push(`<span class="muted small">${cfg.attendance.workEndLabel.label}: ${formatTime12(times.end)}</span>`);
    return `<div class="row gap-md" style="justify-content:space-between;align-items:center;border-bottom:1px solid #F1ECE0;padding:8px 2px;flex-wrap:wrap">
      <span>${c.name}</span>${circle}${tsBits.length?`<span class="row gap-sm" style="flex-wrap:wrap">${tsBits.join('')}</span>`:''}${notes[c.id] ? `<span class="muted small" style="flex:1;min-width:100%">${notes[c.id]}</span>` : ''}</div>`;
  }).join('')}</div>`;

function totalDistributedFromRecord(rec){
  if(!rec) return 0;
  const tanker = Number(rec.qtyDistributed)||0;
  const fridge = (rec.withdrawals||[]).reduce((s,w)=>s+(Number(w.qty)||0),0);
  return tanker + fridge;
}
function daysInMonth(yyyymm){
  const [y,m] = yyyymm.split('-').map(Number);
  return new Date(y, m, 0).getDate();
}
function monthDateStr(yyyymm, dayNum){
  const [y,m] = yyyymm.split('-').map(Number);
  const dt = new Date(y, m-1, 1);
  dt.setDate(dt.getDate() + (dayNum-1));
  return toStr(dt);
}
function monthOf(dateStr){ return dateStr.slice(0,7); }
function monthShift(yyyymm, delta){
  const [y,m] = yyyymm.split('-').map(Number);
  const dt = new Date(y, m-1+delta, 1);
  return `${dt.getFullYear()}-${pad(dt.getMonth()+1)}`;
}
function mosquesForRange(months){
  const start = months[0], end = months[months.length-1];
  return MOSQUES.filter(m=>{
    if(m.createdMonth && m.createdMonth > end) return false;
    if(m.active===false){
      if(!m.deletedMonth) return false;
      if(m.deletedMonth < start) return false;
    }
    return true;
  });
}
async function loadMonthData(yyyymm){
  const total = daysInMonth(yyyymm);
  const data = {};
  for(const m of MOSQUES){ data[m.id] = {}; }
  const jobs = [];
  for(let d=1; d<=total; d++){
    const dateStr = monthDateStr(yyyymm, d);
    for(const m of MOSQUES){
      jobs.push(loadRecord(m.id, dateStr).then(rec=>{ data[m.id][dateStr] = rec; }));
    }
  }
  await Promise.all(jobs);
  return data;
}
